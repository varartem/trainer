дать несколько экземпляров одного класса.","Под наследованием понимают сетевую передачу, под полиморфизмом — обязательную множественность объектов одного типа.","Наследование — механизм транспорта данных, а полиморфизм — построение множества идентичных экземпляров."]],"three-2":[["Класс — экземпляр объекта, объект — описание его полей; интерфейс содержит только готовую реализацию.","Класс — готовый экземпляр, объект — описание свойств этого класса; интерфейс состоит исключительно из реализованных методов.","Объект определяет класс, а класс — конкретный экземпляр; интерфейс содержит только исполнимый код.","Класс является экземпляром, объект задаёт схему полей, а интерфейс — набор полностью готовых реализаций."],["Класс описывает структуру и поведение, объект — его экземпляр; интерфейс задаёт контракт, абстрактный класс может совмещать контракт и общую реализацию.","Класс задаёт тип и операции, объект создаётся по этому описанию; интерфейс устанавливает обязательные возможности, абстрактный класс может дать и требования, и готовые методы.","Объект — экземпляр класса, интерфейс — контракт, а абстрактный базовый класс вправе содержать как абстрактные, так и реализованные методы.","Класс описывает будущие экземпляры, интерфейс — ожидаемое поведение, абстрактный класс нередко сочетает общий код с незавершёнными методами."],["Интерфейс всегда хранит состояние, а абстрактный класс не может определять реализованные методы.","Интерфейс обязательно содержит собственные данные, а абстрактный класс не имеет права предоставлять реализованные методы.","Состояние нужно хранить именно в интерфейсе, а любые методы абстрактного класса должны оставаться без тела.","Интерфейс служит для хранения состояния, абстрактные классы ограничены пустыми объявлениями методов."],["Объект и класс — одно и то же, а интерфейсы и абстрактные классы существуют только в Python.","Между классом и объектом нет разницы; интерфейсы и абстрактные классы характерны исключительно для Python.","Классы и экземпляры — одно понятие, контракты и абстрактные базовые типы есть только в Python.","Класс можно без различия называть объектом, а механизм интерфейсов не встречается вне Python."]],"three-3":[["Композиция и агрегация — разновидности отношения «является» (is-a), наследование выражает «содержит» (has-a).","Композиция и агрегация описывают отношение is-a, в то время как наследование означает has-a.","Наследование моделирует включение одного объекта в другой, композиция — принадлежность к типу.","Для отношения «является разновидностью» применяют композицию и агрегацию; «содержит» реализуют наследованием."],["Композиция и агрегация задают отношения «содержит»; при композиции жизненный цикл части теснее связан с целым, при агрегации часть может существовать независимо.","Оба подхода описывают «целое содержит часть»; в композиции часть обычно зависит от жизненного цикла целого, при агрегации может существовать отдельно.","Композиция задаёт тесное владение компонентом, агрегация — более свободную связь объектов; обе являются вариантами has-a, в отличие от наследования is-a.","Объект может включать другой объект: композиция предполагает сильную связь их жизненных циклов, агрегация допускает самостоятельную жизнь части."],["Композиция возможна только между интерфейсами, агрегация — только между абстрактными классами.","Композицию применяют только к интерфейсам, агрегацию — исключительно к абстрактным классам.","С обычными классами нельзя строить композицию, а агрегация разрешена лишь для ABC.","Для включения интерфейса используется композиция, для включения абстрактного типа — агрегация, других вариантов нет."],["Композиция означает копирование всех методов класса, агрегация — множественное наследование.","Композиция копирует методы из класса целиком, а агрегация позволяет наследоваться сразу от нескольких родителей.","Смысл композиции — дублировать реализацию другого класса, агрегации — множественное наследование.","Композиция переносит код методов, а агрегация создаёт иерархию с несколькими базовыми классами."]],"three-4":[["SRP — одна ответственность; OCP — расширение без модификации существующего кода; LSP — подстановка наследников; ISP — узкие интерфейсы; DIP — зависимость от абстракций.","SOLID: SRP — одна зона ответственности, OCP — расширяемость без изменения стабильной реализации, LSP — заменяемость базового типа наследником, ISP — небольшие интерфейсы, DIP — опора на абстракции.","SRP разделяет ответственности; OCP поощряет расширение; LSP требует корректной подстановки; ISP избегает громоздких контрактов; DIP отделяет высокоуровневый код от конкретных реализаций.","Пять принципов SOLID: Single Responsibility, Open/Closed, Liskov Substitution, Interface Segregation и Dependency Inversion — про ответственность, расширяемость, подстановку, интерфейсы и зависимости."],["SRP — один метод в классе; OCP — запрет наследования; LSP — одинаковые имена методов; ISP — один интерфейс на проект; DIP — зависимости только от конкретных классов.","SRP требует один метод на класс, OCP запрещает потомков, LSP — просто одинаковые имена методов, ISP — единый интерфейс для всех, DIP — зависимости от concrete-классов.","По SOLID класс должен иметь только один метод, расширять его наследованием нельзя, важны имена, контракт один на проект и зависимости лишь от реализаций.","SRP = один метод, OCP = никакого наследования, LSP = совпадение названий, ISP = один интерфейс, DIP = конкретные типы."],["SRP — потокобезопасность; OCP — оптимизация; LSP — управление памятью; ISP — изоляция БД; DIP — шифрование.","SOLID трактует SRP как thread safety, OCP как ускорение, LSP как выделение памяти, ISP как изоляцию БД, DIP как криптографию.","За потокобезопасность отвечает SRP, оптимизацию — OCP, память — LSP, БД — ISP, шифрование — DIP.","Аббревиатуры SOLID относятся к конкурентности, performance, memory, database isolation и encryption соответственно."],["SOLID — пять правил только для работы с SQL-таблицами: схемы, ограничения, блокировки, индексы и денормализация.","SOLID состоит из пяти рекомендаций исключительно по SQL: схемы, constraints, locks, indexes и денормализация.","Эти принципы относятся только к реляционным таблицам и выбору индексов, ограничений и блокировок.","SOLID — термин для проектирования SQL-схем, включающий пять правил работы с данными."]],"three-5":[["DRY — дублировать логику для независимости, KISS — оптимизировать любую функцию, YAGNI — заранее реализовывать возможные требования.","DRY предлагает дублировать логику ради независимости, KISS — оптимизировать каждую функцию, YAGNI — строить функции заранее под гипотетические требования.","Согласно DRY копирование полезно, KISS требует постоянной оптимизации, YAGNI — ранней реализации будущих возможностей.","DRY = повторять код, KISS = заранее ускорять всё, YAGNI = добавлять функциональность до запроса бизнеса."],["DRY — избегать дублирования знаний, KISS — не усложнять решение без необходимости, YAGNI — не делать функциональность до появления реальной потребности.","DRY сокращает дубли знаний, KISS защищает от лишней сложности, YAGNI призывает не реализовывать то, что пока не нужно.","Не повторять одну и ту же логику без причины — DRY; делать достаточно просто — KISS; не строить возможности наперёд — YAGNI.","DRY препятствует копированию правил, KISS сохраняет простоту дизайна, YAGNI отсекает непроверенные будущие функции."],["DRY — писать только чистые функции, KISS — избегать ООП, YAGNI — отказываться от тестирования.","DRY означает исключительно чистые функции, KISS запрещает объектный подход, YAGNI рекомендует не писать тесты.","По этим правилам надо избегать состояния, отказаться от ООП и исключить тестирование.","DRY = pure functions, KISS = никакого объектного кода, YAGNI = без автотестов."],["Все три принципа требуют максимально абстрактного кода и универсальной архитектуры на будущее.","DRY, KISS и YAGNI вместе требуют наиболее абстрактной и универсальной архитектуры на все возможные случаи.","Общий смысл трёх принципов — максимизировать число абстракций и предусмотреть каждое будущее расширение.","Все они поощряют сложную универсальную основу, пригодную для любых пока неизвестных потребностей."]],"three-6":[["Паттерн — готовая библиотека, которую подключают без адаптации; все паттерны относятся к архитектуре БД.","Паттерн — подключаемый пакет без изменений; любой паттерн описывает только проектирование баз данных.","Шаблоны проектирования — готовые библиотеки, которые не требуют адаптации и применяются исключительно к SQL-схемам.","Паттерн означает внешнюю зависимость, полностью готовую к использованию, и все они связаны с БД."],["Порождающие паттерны управляют коммуникацией, структурные — созданием объектов, поведенческие — размещением классов по пакетам.","Порождающие паттерны регулируют взаимодействие, структурные создают экземпляры, поведенческие раскладывают классы по каталогам.","Создание объектов — обязанность структурных паттернов, коммуникация — порождающих, а поведение — файловой структуры проекта.","Порождающие решения выбирают сообщения, структурные создают объекты, поведенческие распределяют модули."],["Паттерны — повторно используемые способы решения типовых задач; Factory Method — порождающий, Adapter — структурный, Observer — поведенческий.","Паттерны — типовые схемы решения задач; Factory Method относится к созданию объектов, Adapter — к структурным обёрткам, Observer — к взаимодействию участников.","Шаблоны проектирования предлагают повторно применяемые идеи, не готовые библиотеки: фабричный метод порождающий, адаптер структурный, наблюдатель поведенческий.","Классы GoF-паттернов включают порождающие (Factory Method), структурные (Adapter) и поведенческие (Observer)."],["Factory Method — поведенческий паттерн, Adapter — порождающий, Observer — структурный.","Factory Method описывает поведение, Adapter — создание, Observer — структуру объектов.","К поведенческим паттернам относят Factory Method, к порождающим Adapter, к структурным Observer.","Фабричный метод — поведенческий, адаптер — порождающий, наблюдатель — структурный паттерн."]],"three-7":[["Процедурное строится вокруг последовательностей действий и процедур, ООП — вокруг объектов, функциональное — вокруг функций и композиции, часто с упором на неизменяемость.","Процедурный стиль организует шаги и процедуры, ООП — данные вместе с методами, функциональный — функции, их композицию и часто неизменяемые значения.","В процедурной парадигме главное — последовательность действий, в объектной — взаимодействие объектов, в функциональной — преобразования через функции.","Процедуры описывают операции, объекты инкапсулируют состояние с поведением, функциональный подход стремится к композиции функций и меньшему количеству мутаций."],["Процедурное программирование запрещает функции, ООП запрещает состояние, функциональное требует обязательного наследования.","Процедурный стиль запрещает функции, ООП не допускает состояния, а функциональный требует иерархий наследования.","В процедурном коде нельзя определять процедуры, объекты обязаны быть stateless, функциональный код требует классов-наследников.","Функции несовместимы с процедурной парадигмой, данные с состоянием — с ООП, а ФП возможно лишь с inheritance."],["ООП и функциональное программирование не могут сосуществовать в одном языке или программе.","Один язык не может одновременно поддерживать ООП и функциональные приёмы.","При выборе объектного стиля функциональное программирование в том же приложении запрещено.","Функциональная и объектная парадигмы взаимно исключаются даже в мультипарадигменных языках."],["Функциональное программирование означает только использование встроенной функции `map`, а процедурное — наличие SQL-процедур.","Функциональный стиль означает только вызов `map`, а процедурный — исключительно написание хранимых SQL-процедур.","Для ФП достаточно встроенного map, процедурный код определяется наличием stored procedures в базе.","Все функциональные программы сводятся к `map`, а процедурные — к SQL-процедурам."]],"three-8":[["Алгоритм — только программа, написанная на компилируемом языке; его свойство — максимальная скорость.","Алгоритмом называется исключительно код на компилируемом языке; корректность измеряется только скоростью работы.","Алгоритм существует лишь в скомпилированной программе, а единственное требование к нему — максимальная производительность.","Если решение записано не на компилируемом языке или медленно работает, это уже не алгоритм."],["Алгоритм — определённая последовательность шагов для решения класса задач; корректность означает получение требуемого результата на допустимых входах, а для полного алгоритма также завершение.","Алгоритм — однозначно описанный способ решения задач через шаги; корректный алгоритм даёт нужный ответ для разрешённых входов и при полной корректности завершает работу.","Последовательность действий для класса входных данных называют алгоритмом; правильность требует верного результата, а полнота — конечного завершения.","Алгоритм задаёт правила преобразования входа в результат; корректность проверяется на допустимых данных, завершение необходимо для полной корректности."],["Алгоритм корректен, если проходит хотя бы один пример; конечность не рассматривается.","Алгоритм считается правильным после одного успешно пройденного примера, а завершаться ему необязательно.","Одного тест-кейса достаточно, чтобы доказать корректность, даже если программа иногда бесконечна.","Для признания алгоритма корректным хватит любого одного правильного ответа; остановка неважна."],["Алгоритм обязательно должен использовать рекурсию и иметь сложность не хуже O(log n).","Любой алгоритм обязан быть рекурсивным и работать не медленнее O(log n).","Без рекурсивных вызовов решение алгоритмом не считается, а сложность должна быть логарифмической.","Корректные алгоритмы обязательно используют рекурсию и имеют предел сложности O(log n)."]],"three-9":[["Big O задаёт точное число миллисекунд, а пространственная сложность — размер исходного файла.","Big O определяет точное время в миллисекундах, пространственная сложность измеряет размер файла с исходниками.","Нотация O сообщает реальную длительность выполнения, а память оценивают числом байт исходного кода.","Big O позволяет вычислить точный runtime; space complexity — объём текстового файла программы."],["Big O описывает асимптотическую верхнюю границу роста затрат; временная сложность — число элементарных шагов, пространственная — дополнительную память или общий расход памяти по выбранной модели.","Big O описывает асимптотическую верхнюю оценку роста потребления ресурсов; время оценивают по операциям, память — по требуемому объёму хранения.","Нотация O характеризует порядок роста затрат при увеличении входа; временные затраты — шаги вычисления, пространственные — память.","При анализе Big O игнорируют малозначимые множители ради оценки масштабирования; отдельно рассматривают вычислительную работу и расход памяти."],["Big O применима только к сортировкам и не описывает поиск или алгоритмы на графах.","Big O предназначена исключительно для сортировки и неприменима к алгоритмам поиска или графам.","Асимптотическую нотацию используют только в задачах сортирования, не для других алгоритмов.","Записывать сложность поиска, обходов графов и иных операций через O некорректно."],["Временная сложность и пространственная сложность всегда совпадают по порядку роста.","Рост времени выполнения и рост используемой памяти всегда описываются одной и той же O-оценкой.","Если время O(n), память тоже обязательно O(n), и наоборот.","Time complexity и space complexity не могут отличаться асимптотически у одного алгоритма."]],"three-10":[["O(1) — постоянное число операций; O(log n) — бинарный поиск; O(n) — линейный проход; O(n log n) — сортировка слиянием; O(n²) — двойной цикл; O(2ⁿ) — полный перебор подмножеств.","Постоянная работа — O(1), бинарный поиск — O(log n), один проход — O(n), mergesort — O(n log n), вложенные циклы — O(n²), перебор подмножеств — O(2ⁿ).","Типичные примеры: O(1) — доступ за константное время, O(log n) — деление диапазона, O(n) — просмотр всех элементов, O(n log n) — сортировка слиянием, O(n²) — две вложенные итерации, O(2ⁿ) — перебор всех подмножеств.","Шкала сложности от константной до экспоненциальной: O(1) простая операция, log n — бинарный поиск, n — линейный обход, n log n — mergesort, n² — двойной цикл, 2ⁿ — все подмножества."],["O(1) — линейный проход; O(log n) — сортировка пузырьком; O(n) — перебор всех подмножеств; O(n²) — бинарный поиск.","Линейный обход имеет O(1), пузырьковая сортировка — O(log n), полный перебор подмножеств — O(n), бинарный поиск — O(n²).","Одна итерация по коллекции считается константной, bubble sort логарифмической, подмножества линейными, binary search квадратичным.","Классификация такова: O(1) просмотр массива, O(log n) bubble sort, O(n) powerset, O(n²) деление отсортированного массива пополам."],["O(log n) означает удвоение работы при каждом добавленном элементе, а O(2ⁿ) — линейный рост.","Логарифмическая сложность удваивает затраты с каждым новым элементом, экспоненциальная 2ⁿ растёт линейно.","Если размер входа увеличится на один, O(log n) удвоит время, а O(2ⁿ) добавит лишь постоянную работу.","O(log n) соответствует удвоению усилий при +1 к n, а O(2ⁿ) — прямой пропорциональности n."],["O(n log n) — всегда быстрее O(n) при любых размерах входа, потому что константы не имеют значения.","Алгоритм O(n log n) быстрее O(n) на любом конечном входе, даже при огромных константах.","n log n всегда работает эффективнее линейного n независимо от входа и накладных расходов.","Нотации гарантируют, что O(n log n) превосходит O(n) по времени для каждого n, не учитывая константные множители."]],"three-11":[["Пузырьковая в общем случае O(n log n), быстрая всегда O(n), сортировка слиянием всегда O(n²).","Bubble sort имеет O(n log n), quicksort строго O(n), mergesort O(n²) во всех случаях.","Сложности распределены так: пузырьковая — n log n, быстрая — всегда n, слиянием — n².","Quicksort гарантированно линейная, mergesort квадратичная, bubble sort O(n log n)."],["Пузырьковая обычно O(n²); quicksort в среднем O(n log n), в худшем O(n²); mergesort O(n log n) и обычно требует дополнительную память для массивов.","Пузырьковая обычно квадратична; быстрая сортировка в среднем n log n, но может дать n²; сортировка слиянием n log n с типичными затратами на дополнительный массив.","Bubble sort обычно O(n²), quicksort чаще O(n log n) и в худшем случае O(n²), mergesort O(n log n), обычно использует буфер при работе с массивами.","Сортировка пузырьком медленная на больших объёмах (n²), quicksort имеет квадратичный худший случай, mergesort сохраняет n log n и часто требует extra memory."],["Все три алгоритма имеют одинаковую худшую сложность O(n log n) и одинаково устойчивы.","У всех трёх алгоритмов одинаковая худшая сложность O(n log n), и каждый одинаково стабилен.","Bubble, quick и merge sort неизменно дают n log n даже в худшем случае, без различий по стабильности.","Эти сортировки эквивалентны по worst-case сложности и сохранению порядка равных элементов."],["Quicksort и mergesort — методы поиска элемента, а пузырьковая сортировка — алгоритм хеширования.","Quicksort и mergesort выполняют поиск, а пузырьковый алгоритм строит хеши вместо сортировки.","Быстрая и слиянием — это разновидности поиска ключа, bubble — способ хеширования.","Quicksort/mergesort находят элемент, bubble sort лишь вычисляет хеши значений."]],"three-12":[["Бинарный поиск сравнивает элементы со случайными значениями; подходит для любого несортированного массива за O(log n).","Бинарный поиск случайно выбирает опорные значения и работает на неотсортированных массивах за O(log n).","Для двоичного поиска сортировка не нужна, потому что на каждом шаге сравнение проводится со случайным элементом.","Алгоритм деления использует произвольный массив без порядка и всё равно обеспечивает логарифмическое время."],["Бинарный поиск каждый раз делит упорядоченную область поиска пополам; при доступе к середине за O(1) его сложность O(log n).","В упорядоченном диапазоне бинарный поиск сравнивает середину и отбрасывает половину области; при O(1) доступе к середине выполняет O(log n) шагов.","Двоичный поиск требует упорядоченности и повторного деления области пополам, благодаря чему количество сравнений растёт логарифмически.","Если элементы отсортированы и доступны по индексу, binary search сужает интервалы вдвое и занимает O(log n)."],["Бинарный поиск всегда сканирует половину элементов, поэтому работает за O(n/2) и не требует порядка.","При бинарном поиске неизбежно просматривается половина массива, поэтому сложность O(n/2), а сортировка неважна.","Алгоритм двоичного поиска линейный и проверяет n/2 значений без требования порядка.","Для бинарного поиска достаточно проверить примерно половину любых элементов массива: это O(n/2)."],["Бинарный поиск требует хеш-таблицу с уникальными ключами и имеет среднюю сложность O(1).","Бинарный поиск возможен только внутри хеш-таблицы с уникальными ключами, в среднем даёт O(1).","Чтобы применить binary search, нужно хранить ключи в hash table, тогда ожидаемое время константно.","Двоичный поиск — частный случай lookup в хеш-таблице и требует уникальности всех ключей."]],"three-13":[["Рекурсия — вызов функции самой себя; базовый случай останавливает вложенные вызовы, а слишком большая глубина может исчерпать стек.","При рекурсии функция вызывает себя с уменьшением задачи, останавливается на базовом случае; глубокие вызовы могут превысить лимит стека.","Рекурсивный алгоритм повторно запускает тот же метод; условие остановки прерывает цепочку, слишком много кадров вызовов вызывают stack overflow.","Самовызовы отличают рекурсию от циклов; без базового случая или при слишком большой глубине стек может исчерпаться."],["Рекурсия — обязательное выполнение кода без функций, базовый случай нужен для ускорения SQL.","Рекурсия требует вовсе не использовать функции, а базовый случай оптимизирует запросы SQL.","Рекурсивным называют код без вызовов функций, где базовая ветка ускоряет работу БД.","Рекурсия — безфункциональное повторение, а её условие остановки нужно для оптимизации SQL."],["Итерация всегда использует больше памяти, чем любая рекурсия; рекурсия не зависит от глубины входа.","Любой цикл расходует больше памяти, чем рекурсивный вызов; глубина рекурсии не влияет на использование стека.","Итерация всегда более затратна по памяти, при любой глубине рекурсия требует одинаковый объём.","Глубина рекурсивных вызовов не увеличивает память, зато цикл всегда потребляет больше."],["Переполнение стека происходит только при бесконечном цикле `while`, но не при вложенных вызовах.","Stack overflow возможен только при бесконечном цикле `while`; рекурсивные вызовы стек не переполняют.","Переполнение стека связано исключительно с циклами без выхода, вложенность функций к нему не приводит.","Сколько бы рекурсивных кадров ни создали, stack overflow не случится — причина всегда `while`."]],"three-14":[["Динамическое программирование — выполнение одного алгоритма на нескольких процессорах; мемоизация означает кэш файлов.","Динамическое программирование — это параллельное выполнение на процессорах, а мемоизация — сохранение файлов на диске.","DP распределяет вычисления по ядрам, memoization относится только к файловому кэшу.","Под dynamic programming понимают многопроцессорность, под мемоизацией — кэширование содержимого файлов."],["Динамическое программирование использует перекрывающиеся подзадачи и оптимальную подструктуру; мемоизация кеширует результаты рекурсивно, табуляция заполняет таблицу снизу вверх.","DP переиспользует результаты пересекающихся подзадач; мемоизация обычно решает их сверху вниз с кэшем, табуляция вычисляет состояния снизу вверх.","Когда подзадачи повторяются и есть оптимальная подструктура, их ответы сохраняют: memoization при рекурсии, tabulation при итеративном заполнении таблицы.","Динамическое программирование снижает повторные расчёты; top-down с кэшем — мемоизация, bottom-up — табуляция."],["Мемоизация всегда вычисляет все возможные состояния, а табуляция вычисляет только востребованные.","Мемоизация обязательно посещает все состояния, а табуляция — только реально запрошенные.","Top-down всегда заполняет полную таблицу, bottom-up пропускает ненужные позиции.","Мемоизация вычисляет каждую возможную подзадачу, табуляция ограничивается востребованными."],["Динамическое программирование применимо только к сортировкам и не работает с задачами оптимизации.","Динамическое программирование применимо только к сортировке, но не к оптимизационным проблемам.","DP нельзя использовать для поиска оптимальных решений, только для упорядочивания массивов.","Любая задача динамического программирования должна быть сортировкой, не задачей оптимизации."]],"three-15":[["Массив обеспечивает индексированный доступ, связный список соединяет узлы ссылками, стек работает по LIFO, очередь — по FIFO.","Массив предоставляет доступ по индексу, связный список связывает элементы указателями, стек обслуживает последнее добавленное первым, очередь — первое добавленное первым.","Элементы массива адресуются по позиции, в linked list узлы ссылаются друг на друга; stack = LIFO, queue = FIFO.","Массив пригоден для индексного чтения, linked list хранит цепочку узлов, стек извлекает последнее, очередь — наиболее раннее."],["Массив всегда доступен только последовательно, связный список всегда имеет O(1) доступ по индексу.","Массив читают лишь последовательным обходом, зато связный список допускает прямое O(1) обращение к любому индексу.","В массиве нельзя получить элемент по индексу, а в linked list это делается за константу.","Индексный доступ отсутствует у массивов и всегда O(1) у связанных списков."],["Стек работает по FIFO, очередь — по LIFO; остальные структуры эквивалентны.","Стек извлекает первый добавленный элемент, очередь — последний; массив и список полностью равнозначны.","Стек следует FIFO, очередь LIFO, различий между массивом и linked list нет.","Очередь работает по принципу последнего входа, стек — первого входа; остальные контейнеры эквивалентны."],["Массив и связный список обязательно отсортированы, а стек и очередь не хранят значения.","Массив и связный список по определению сортированы, а в стеке и очереди нельзя хранить данные.","Обе последовательные структуры обязательно упорядочены по значению, а stack/queue содержат только операции, без элементов.","Массив и linked list всегда отсортированы; стек и очередь служат лишь управлением и не держат значений."]],"three-16":[["Хеш-таблица хранит элементы в отсортированном дереве; коллизия означает отсутствие хеш-функции.","Hash table фактически является отсортированным деревом, а коллизия возникает, если хеш-функция отсутствует.","Хеш-таблица организована как ordered tree, конфликт ключей означает, что нет функции hash.","Элементы hash table хранятся в сортированном дереве, а collision — отсутствие алгоритма хеширования."],["Хеш-таблица вычисляет индекс или группу слотов из хеша ключа; коллизии возникают, когда разные ключи попадают в одно место, и разрешаются пробированием или цепочками.","Хеш ключа указывает корзину или слот; разные ключи могут попасть в одно место — коллизии обрабатывают цепочками или открытой адресацией.","Таблица адресует позиции по hash, столкновение двух разных ключей в одной корзине решается chaining либо probing.","В хеш-таблице ключ преобразуется в индекс; при совпадении индексов применяют хранение цепочек или поиск другого слота."],["Хеширование — обратимое шифрование, поэтому два разных ключа не могут иметь одинаковый хеш.","Хеширование — разновидность обратимого шифрования, которая гарантирует отсутствие одинаковых хешей у разных ключей.","Хеш можно расшифровать обратно, и разные значения никогда не дают одинаковый результат.","Любая hash-функция обратима и полностью исключает коллизии между различными ключами."],["Хеш-таблица гарантирует O(1) в худшем случае для любого поиска и при любой атакующей последовательности ключей.","Поиск в хеш-таблице строго O(1) даже в худшем случае и при специально подобранных конфликтующих ключах.","Никакая последовательность коллизий не способна ухудшить константное время lookup.","Worst-case доступ в hash table всегда O(1), включая атаки с многочисленными коллизиями."]],"three-17":[["Бинарное дерево поиска позволяет каждому узлу иметь любое число детей, а элементы хранятся без ограничения порядка.","В бинарном дереве поиска узел может иметь сколько угодно потомков, а ключи располагаются произвольно.","BST не ограничивает ветвление двумя детьми и не устанавливает порядок между ключами.","В search tree каждому узлу допустимо иметь много детей, значения размещают без сравнения."],["В BST левое поддерево содержит меньшие ключи, правое — большие (с учётом политики дубликатов); поиск/вставка/удаление в среднем O(log n) при сбалансированной высоте, в худшем O(n).","BST поддерживает правило левого и правого поддерева по ключам; при сбалансированной высоте операции поиска, вставки и удаления логарифмичны, при вырождении — линейны.","В бинарном дереве поиска меньшие значения идут налево, большие направо (дубликаты оговариваются); работа O(log n) при балансе и O(n) в худшем случае.","У BST упорядоченное разделение по поддеревьям; высота определяет затраты операций: около log n в балансе, до n в цепочке."],["Любое бинарное дерево автоматически сбалансировано, поэтому поиск всегда O(1).","Любое бинарное дерево изначально сбалансировано, а поиск в нём всегда выполняется за O(1).","Сам факт бинарности дерева гарантирует оптимальную высоту и постоянное время поиска.","В BST баланс обеспечен по определению, поэтому lookup всегда константный."],["BST предназначено только для обхода графов и не поддерживает вставку и удаление узлов.","BST создан только для обхода графов; вставлять и удалять вершины из него нельзя.","Бинарное дерево поиска — фиксированная вспомогательная структура для DFS/BFS без операций изменения.","Search tree служит исключительно графовым обходам, а insert и delete не поддерживает."]],"three-18":[["Граф состоит из вершин и рёбер; в ориентированном рёбра имеют направление, во взвешенном — значение веса, например стоимость или расстояние.","Вершины и рёбра образуют граф; ориентированные рёбра задают направление, взвешенные имеют числовую или иную стоимость.","Граф — набор узлов и связей, направление может быть задано для ребра, а вес отражать расстояние или цену перехода.","Ориентация определяет, можно ли идти по ребру в одну сторону, вес — дополнительное значение ребра; базовые элементы графа — вершины и рёбра."],["Ориентированный граф обязательно ацикличен, а неориентированный не может содержать маршрутов.","Ориентированные графы не могут содержать циклов, а в неориентированных невозможно построить маршрут.","Любой directed graph обязательно DAG, а undirected graph не имеет путей между вершинами.","Направленные рёбра исключают циклы, ненаправленные — любые маршруты."],["Взвешенный граф — это граф с числом вершин более двух, а невзвешенный — с одной вершиной.","Вес означает, что в графе больше двух вершин; отсутствие веса — что вершина только одна.","Взвешенными называют графы с минимум тремя узлами, невзвешенными — одиночные вершины.","У weighted graph число вершин >2, у unweighted всегда ровно 1."],["Граф — частный случай связного списка, в котором у каждой вершины ровно один сосед.","Граф — особый связный список, где у каждой вершины может быть лишь один сосед.","Любой граф устроен как цепочка узлов с единственным исходящим ребром на вершину.","Граф — это linked list без ветвлений, каждая вершина связана только с одним соседом."]],"three-19":[["DFS всегда находит кратчайший путь, BFS всегда выполняется быстрее независимо от графа.","DFS гарантирует кратчайший маршрут, BFS всегда быстрее по времени на любом графе.","Поиск в глубину неизменно находит shortest path, а поиск в ширину во всех случаях выполняется быстрее.","DFS оптимален для кратчайших путей, BFS имеет меньшую сложность независимо от структуры графа."],["DFS использует стек или рекурсию и углубляется по ветви; BFS использует очередь и обходит по слоям, находя кратчайший путь по числу рёбер в невзвешенном графе.","DFS идёт по ветви, используя стек или рекурсивные вызовы; BFS идёт слоями через очередь и в невзвешенном графе находит минимум рёбер.","В глубину обходят через stack, в ширину — через queue; BFS в графе без весов возвращает кратчайшую по числу переходов дистанцию.","DFS сначала углубляется, BFS последовательно посещает соседние уровни; последний полезен для кратчайшего пути в unweighted graph."],["DFS и BFS применяются только к деревьям, а графы с циклами они не поддерживают.","DFS и BFS предназначены лишь для деревьев; циклы в графах делают их неприменимыми.","Эти обходы нельзя запускать на графе с циклами и вообще вне древовидных структур.","Поиск в глубину и ширину поддерживается только ацикличными деревьями."],["BFS обязательно применяет приоритетную очередь и веса рёбер, поэтому идентичен алгоритму Дейкстры.","BFS использует приоритетную очередь и веса рёбер, то есть является тем же алгоритмом, что и Дейкстра.","В BFS обязательно есть heap по стоимости пути, поэтому он эквивалентен Dijkstra.","Поиск в ширину вычисляет приоритеты по весам и фактически совпадает с алгоритмом Дейкстры."]],"three-20":[["Потоки одного процесса обычно разделяют адресное пространство и ресурсы процесса; отдельные процессы изолированы и взаимодействуют через IPC.","Потоки внутри процесса используют общее виртуальное адресное пространство и многие ресурсы, процессы обычно изолированы и передают данные через IPC.","Threads совместно работают с памятью процесса, отдельные процессы имеют независимую память и общаются посредством межпроцессного взаимодействия.","Один процесс может содержать несколько потоков с доступом к общим данным; для обмена между разными процессами нужны IPC-механизмы."],["Каждый поток имеет собственное независимое адресное пространство, а процессы внутри ОС обязательно разделяют одну кучу.","Каждый поток изолирован собственной адресацией, тогда как процессы операционной системы обязательно используют одну общую кучу.","Потоки никогда не делятся памятью, а все процессы получают единое heap-пространство.","Разные threads всегда независимы по памяти, отдельные OS-processes автоматически совместно владеют кучей."],["Процесс — это только функция в программе, а поток — отдельный компьютер, запущенный в кластере.","Процесс — просто вызванная функция, а поток обозначает отдельную машину в вычислительном кластере.","Process и thread различают как функцию внутри программы и физический сервер.","Процессом называют один метод, потоком — удалённый компьютер, который исполняет задачу."],["Потоки гарантируют отсутствие гонок, а процессы не могут обмениваться данными между собой.","Потоки по определению не имеют гонок, а процессы полностью лишены способов обмениваться информацией.","Общая память потоков безопасна без синхронизации, а между процессами связь невозможна.","При threads race condition исключён, при processes не существует IPC."]],"three-21":[["Race Condition — ошибка при отсутствии сети; Deadlock — завершение программы; Starvation — недостаток оперативной памяти.","Race Condition обозначает потерю сети, Deadlock — обычное завершение программы, Starvation — нехватку RAM.","Гонка — это ошибка сетевого соединения, взаимная блокировка — остановка приложения, голодание — малый объём оперативной памяти.","Race = недоступность сети, Deadlock = завершение процесса, Starvation = дефицит памяти."],["Race Condition возникает при зависимости результата от порядка конкурентных операций; Deadlock — взаимное ожидание ресурсов; Starvation — длительное неполучение ресурсов или времени выполнения.","При Race Condition результат зависит от чередования конкурентных действий; при Deadlock участники ждут друг друга, при Starvation один участник долго не получает ресурса.","Гонка возникает из-за порядка выполнения, взаимная блокировка — циклического ожидания, голодание — длительного отсутствия возможности выполнить работу.","Race condition — недетерминированный результат конкуренции, deadlock — взаимная остановка из-за ожиданий, starvation — несправедливое распределение времени или ресурсов."],["Deadlock — обычное ожидание I/O, а Starvation означает полный отказ процессора.","Deadlock — штатное ожидание ввода-вывода, Starvation — полный выход процессора из строя.","Взаимная блокировка означает обычный сетевой запрос в ожидании, голодание — аппаратный отказ CPU.","Обычная пауза на I/O называется deadlock, а неработающий процессор — starvation."],["Race Condition и Deadlock устраняются исключительно увеличением числа потоков.","Увеличение количества потоков само по себе гарантированно устраняет гонки и дедлоки.","Чтобы решить race condition или deadlock, достаточно добавить дополнительные threads.","При большем числе потоков синхронизационные ошибки исчезают автоматически."]],"three-22":[["Мьютекс ограничивает доступ к критической секции одним владельцем; семафор управляет счётчиком разрешений; атомарная операция неделима для других участников.","Мьютекс обеспечивает эксклюзивный доступ владельца, семафор считает доступные разрешения, атомарная операция наблюдается неделимой.","Mutex допускает одного владельца критической секции, semaphore управляет ограниченным набором пропусков, atomic operation выполняется как единое действие.","Для взаимного исключения нужен мьютекс, для ограничения числа входов — счётный семафор; атомарность не допускает промежуточного наблюдаемого состояния."],["Мьютекс допускает неограниченное число одновременных владельцев, семафор всегда только одного.","Мьютекс может одновременно принадлежать любому числу потоков, а семафор всегда разрешает только один вход.","Mutex — неограниченное совместное владение, semaphore — строго одно разрешение.","Для множественных владельцев используют мьютекс, для единственного — любой семафор без счётчика."],["Атомарная операция — просто короткая функция, которая выполняется быстрее любого контекстного переключения.","Атомарность операции определяется лишь её короткой длительностью относительно смены контекста.","Любая быстро работающая функция атомарна, если выполняется до переключения потоков.","Atomic operation — просто вызов, который занимает меньше времени, чем context switch."],["Все три механизма управляют исключительно сетевыми запросами и не применяются к общей памяти.","Мьютексы, семафоры и атомарные операции предназначены только для сетевых вызовов и неприменимы в RAM.","Все эти примитивы относятся исключительно к сетевому взаимодействию, не к конкурентной памяти.","Синхронизация общих данных не использует mutex, semaphore или atomic; они нужны для HTTP."]],"three-23":[["Стек обычно хранит кадры вызовов и локальный контекст, куча — динамически размещаемые объекты; управление временем жизни и доступом к ним различается.","Стек обычно хранит контексты вызовов и кадры функций, куча — объекты с динамическим временем жизни; правила выделения и освобождения различаются.","Call stack связан с кадрами исполнения функций, heap — с динамическим хранением данных; управление памятью у них устроено неодинаково.","Кадры вызовов чаще размещаются в стеке, динамические объекты — в куче; срок существования и доступ определяются моделью памяти."],["Стек хранит только объекты Python, а куча — только HTTP-запросы.","Стек может содержать только Python-объекты, а heap предназначен исключительно для HTTP-трафика.","Stack хранит исключительно значения языка Python, heap — тела сетевых запросов.","Данные стека — только объекты Python, данные кучи — только HTTP messages."],["Куча освобождается строго при возврате из функции, а стек — только сборщиком мусора.","Куча строго очищается после каждого `return`, а стек освобождает исключительно garbage collector.","Память heap автоматически удаляется при выходе из функции, stack остаётся до запуска GC.","Возврат функции полностью освобождает кучу, тогда как стек обязательно собирает сборщик мусора."],["Стек и куча — синонимы для одного участка памяти; различие существует исключительно в SQL.","Стек и куча идентичны, и различают их только в запросах SQL.","Это два названия одного участка памяти; вне баз данных различия не существует.","Stack и Heap — синонимы общей области памяти и имеют разный смысл лишь для SQL."]],"three-24":[["Виртуальная память — увеличение физического размера RAM за счёт компрессии; каждому процессу передают те же физические адреса.","Виртуальная память лишь физически увеличивает RAM через сжатие, а процессы работают напрямую с одинаковыми физическими адресами.","ВМ — способ сжатия ОЗУ, создающий дополнительные физические байты без адресной изоляции процессов.","При виртуальной памяти каждый процесс напрямую видит один набор физических адресов, а сжатие увеличивает RAM."],["Виртуальная память создаёт изолированное адресное пространство процесса; страницы отображаются на физическую память, а подкачка может переносить страницы между RAM и вторичным хранилищем.","ОС даёт каждому процессу виртуальные адреса, отображаемые страницами на физические; при подкачке часть страниц может перемещаться между RAM и диском.","Изолированное адресное пространство процесса поддерживается таблицами страниц, а swap позволяет выгружать часть памяти во внешнее хранилище.","Виртуальные страницы сопоставляются физическим кадрам; механизм подкачки при необходимости использует RAM и вторичное хранилище."],["Страничная адресация применяется только к GPU, а приложения используют исключительно физические адреса.","Страницы применяются исключительно на видеокартах, обычные приложения всегда адресуют физическую память напрямую.","Paging существует только для GPU, CPU-программы обходятся без виртуальных адресов.","Страничная трансляция не относится к процессам ОС: приложение оперирует лишь физическими адресами."],["Подкачка гарантирует ускорение любой программы и полностью устраняет обращения к диску.","Свопинг безусловно ускоряет любую программу и избавляет от доступа к диску.","Включение подкачки повышает скорость всех процессов и устраняет дисковый ввод-вывод.","Swap делает любое приложение быстрее и полностью исключает обращения к хранилищу."]],"three-25":[["Прикладной, представления, сеансовый, транспортный, сетевой, канальный, физический — уровни от 7 к 1, от сервисов приложения до передачи сигналов.","Сверху вниз модель OSI включает прикладной, представления, сеансовый, транспортный, сетевой, канальный и физический уровни.","Семь уровней OSI (7→1): Application, Presentation, Session, Transport, Network, Data Link, Physical; от приложения до сигналов среды.","На уровнях 7–1 OSI описываются приложения, представление данных, сеанс, транспорт, маршрутизация, кадры канала и передача сигналов."],["HTTP, HTTPS, TCP, UDP, IP, DNS, Ethernet — семь обязательных уровней модели OSI.","Семь уровней OSI — это сами протоколы HTTP, HTTPS, TCP, UDP, IP, DNS и Ethernet.","OSI состоит из перечисления семи обязательных технологий сети: DNS, HTTP, HTTPS, TCP, UDP, IP, Ethernet.","Модель OSI строится как стек из семи протоколов, по одному из HTTP/HTTPS/TCP/UDP/IP/DNS/Ethernet."],["Модель OSI состоит из пяти уровней: бизнес, API, SQL, кэш и физический.","Модель OSI пятиуровневая: бизнес-логика, API, SQL, кэширование и физический уровень.","OSI выделяет ровно пять слоёв: Business, API, Database, Cache, Physical.","В OSI уровни описывают бизнес, веб-API, SQL, кэш и железо, всего их пять."],["Физический уровень управляет авторизацией, сетевой — HTML, транспортный — структурами данных.","На физическом уровне выполняют авторизацию, сетевой формирует HTML, а транспортный выбирает структуры данных программы.","OSI распределяет задачи так: Physical — проверка логина, Network — HTML, Transport — массивы и деревья.","Физический уровень отвечает за права пользователей, сетевой — за разметку, транспортный — за объекты в памяти."]],"three-26":[["TCP передаёт независимые дейтаграммы без подтверждений, а UDP гарантирует порядок и повторную доставку.","TCP не устанавливает соединение и посылает независимые сообщения без подтверждений, а UDP гарантирует порядок и повторные передачи.","TCP работает как best-effort дейтаграммы, зато UDP предоставляет надёжный поток с доставкой по порядку.","Неподтверждённые пакеты — особенность TCP, а гарантированная доставка с восстановлением — UDP."],["TCP — потоковый протокол с установлением соединения, порядком байтов, подтверждениями и повторными передачами; UDP — дейтаграммы без встроенной гарантии доставки и порядка.","TCP создаёт соединение и обеспечивает упорядоченный поток байтов с ACK и retransmission; UDP передаёт дейтаграммы без встроенных гарантий порядка и доставки.","Надёжность TCP обеспечивают подтверждения, номера последовательности и повторы; UDP не гарантирует доставку пакетов.","TCP — connection-oriented потоковый транспорт, UDP — connectionless дейтаграммный; у первого есть управление потерями и порядком, у второго таких гарантий нет."],["UDP работает только внутри локальной сети, а TCP — исключительно через интернет.","UDP работает только внутри локальных сетей, TCP применим исключительно в глобальном интернете.","Дейтаграммы UDP не могут проходить за пределы LAN, а TCP не используют внутри локальной сети.","Протокол UDP ограничен локальным сегментом, TCP — только внешними WAN-соединениями."],["TCP автоматически шифрует полезную нагрузку, а UDP не может использоваться с TLS.","В TCP шифрование включено по определению, а UDP технически несовместим с TLS.","Каждое TCP-соединение автоматически защищает содержимое криптографически, UDP не поддерживает защищённые протоколы.","У TCP всегда есть встроенное шифрование, а через UDP нельзя организовать TLS-подобное защищённое соединение."]],"three-27":[["IP — логический адрес узла в сети, MAC — адрес канального интерфейса, порт — идентификатор конечной точки транспортного протокола, сокет — программный интерфейс обмена данными.","IP адресует интерфейс логически, MAC — на канальном уровне, port выбирает транспортную конечную точку, socket предоставляет приложению API обмена.","Логическая маршрутизация использует IP, кадры локального сегмента — MAC, порты различают службы, сокет служит интерфейсом сетевого взаимодействия.","IP помогает доставить пакет к сетевому адресу, MAC относится к канальному интерфейсу, порт — к транспортному endpoint, сокет — программный объект для обмена."],["IP всегда обозначает конкретное приложение, MAC — доменное имя, порт — физический кабель, сокет — маршрутизатор.","IP-адрес обозначает отдельное приложение, MAC хранит доменное имя, порт соответствует кабелю, сокет — устройству маршрутизации.","IP идентифицирует конкретную программу, MAC — DNS-имя, port — физический провод, socket — роутер.","Роли таковы: IP — приложение, MAC — домен, порт — кабель, сокет — маршрутизатор."],["IP и MAC — одинаковые глобальные идентификаторы; любой порт автоматически соответствует отдельному сетевому интерфейсу.","IP и MAC являются одинаковыми глобальными адресами, а каждому порту нужен свой физический интерфейс.","Между IP и MAC нет отличий, и ОС выделяет сетевую карту под каждый порт.","Оба адреса полностью взаимозаменяемы, а порт всегда указывает отдельный NIC."],["Сокет — только сочетание домена и DNS-записи, а порт применяется исключительно к HTTP.","Сокет — лишь запись DNS о домене, а порты существуют исключительно для веб-протокола HTTP.","Socket равен комбинации домена и DNS-записи, transport ports используются только браузером.","Сокет не является программным интерфейсом: это DNS-имя; порт применим лишь в HTTP."]],"three-28":[["DNS назначает IP-адрес каждому HTTP-запросу; после ответа DNS браузер может сразу рисовать страницу без соединения с сервером.","DNS выдаёт IP каждому HTTP-запросу, а после DNS-ответа браузер рисует страницу, не соединяясь с сайтом.","На каждый запрос к серверу DNS назначает новый IP, потом можно сразу отобразить HTML без HTTP.","Результат DNS подменяет всю передачу веб-страницы: соединение с сервером уже не требуется."],["DNS разрешает доменное имя в нужные записи (например, IP), затем браузер устанавливает соединение, при HTTPS выполняет TLS-обмен и отправляет HTTP-запрос.","Сначала DNS помогает найти сетевой адрес домена, затем клиент устанавливает соединение, при HTTPS согласует TLS и только после этого обменивается HTTP.","Браузер получает записи DNS, подключается к серверу, устанавливает защищённый канал при HTTPS и направляет запрос HTTP.","Путь к странице обычно включает разрешение имени через DNS, соединение с сервером, при необходимости TLS-handshake и HTTP-запрос."],["DNS обязательно передаёт HTML документа и JavaScript, поэтому отдельный веб-сервер не нужен.","DNS сам возвращает HTML и JavaScript страницы, отдельного веб-сервера при этом не нужно.","Система доменных имён передаёт содержимое сайта вместо HTTP-обработчика.","В DNS-записи хранится полный документ вместе со скриптами, поэтому HTTP-сервер не требуется."],["DNS определяет порт приложения и всегда использует только TCP; TLS происходит до поиска IP.","DNS всегда использует только TCP, самостоятельно определяет порт приложения, а TLS начинается ещё до получения IP.","Разрешение DNS строго TCP-ориентировано, выбирает порт сайта, и TLS происходит до поиска адреса.","DNS через TCP сразу сообщает порт сервиса; защищённый обмен устанавливается ещё до DNS-резолва."]],"three-29":[["HTTPS — HTTP поверх TLS: сертификат помогает проверить подлинность сервера, а согласованные ключи обеспечивают шифрование и контроль целостности канала.","HTTPS — это HTTP, передаваемый по TLS-каналу: сертификат удостоверяет сервер, согласованные ключи защищают данные от чтения и незаметного изменения.","При HTTPS поверх HTTP добавляется TLS; сертификат используется для аутентификации стороны, ключи — для конфиденциальности и целостности передачи.","TLS в HTTPS устанавливает защищённое соединение с проверкой серверного сертификата и шифрованием трафика."],["HTTPS — другой формат HTTP, который исключает необходимость сертификатов и установления ключей.","HTTPS представляет собой самостоятельный формат HTTP без сертификатов и обмена криптографическими ключами.","В отличие от HTTP, HTTPS y — 99,99% uptime, Partition Tolerance — шардирование по ключу.","C в CAP — это ACID-проверка таблиц, A — ровно 99,99% доступности, P — метод деления данных по шардам.","Consistency равна constraints БД, Availability — uptime SLA 99,99%, Partition Tolerance — шардирование ключей.","Термины CAP описывают транзакционные проверки, процент времени без падений и горизонтальное распределение таблиц."],["CAP гарантирует, что при наличии трёх реплик система автоматически достигает и C, и A, и P при любых сбоях.","Наличие трёх реплик автоматически обеспечивает согласованность, доступность и сетевую устойчивость даже при любых разделениях.","Три копии данных гарантируют C+A+P одновременно при любом отказе связи.","Чтобы обойти CAP, достаточно добавить третью реплику; после этого все свойства сохраняются при любых сбоях."]]};

      const canCheck=ans?.choice!==undefined&&!checked;
      const footerBtns=checked
        ? `<button type="button" class="btn primary" id="next">${checkedText} ${iconNext}</button>`
        : `<button type="button" class="btn primary" id="check" ${canCheck?'':'disabled'}>Проверить ответ ✓</button><button type="button" class="btn" id="next">${last?'К началу':'Пропустить'} ${iconNext}</button>`;
      main.innerHTML=header(key)+top+`<article class="panel test-panel" id="test-card"><div class="test-toolbar"><span class="question-counter">Вопрос ${String(state.cursor[key]+1).padStart(2,'0')} / ${ids.length} ${state.errorsOnly[key]?' · просмотр ошибок':''}</span><span class="state-pill ${checked?(correct?'right':'wrong'):''}">${checked?(correct?'Верно':'Ошибка'):(ans?'Выбран ответ':'Не отвечен')}</span></div><h3>${format(q.q)}</h3><div class="options">${choices}</div><div class="wording-tools"><button type="button" class="btn wording-refresh" id="refresh-wording" title="Показать новые синонимичные формулировки">↻ Другие формулировки</button><span>Смысл и правильность ответов не меняются</span></div>${feedback}<div class="test-footer"><button type="button" class="btn" id="prev" ${state.cursor[key]===0?'disabled':''}>${iconBack} Назад</button><div class="footer-actions"><span class="keyboard-note">1–4 — выбор · Enter — проверка</span>${footerBtns}</div></div></article><div class="panel navigator"><div class="nav-topline"><span class="mini-heading" style="margin:0">Быстрый переход</span><span class="small">Выберите номер вопроса</span></div><div class="question-grid">${navigation}</div><div class="legend"><span><i></i> Не проверен</span><span><i class="good"></i> Правильно</span><span><i class="bad"></i> Ошибка</span></div></div>${stats.done===stats.total&&!state.errorsOnly[key]?`<div class="finished"><div><strong>Раздел завершён ✦</strong><p>Результат: ${stats.good} из ${stats.total}. ${stats.bad?'Разберите ошибки или начните новую попытку.':'Отлично, все ответы верные!'}</p></div>${stats.bad?'<button type="button" class="btn" id="repeat-wrong">Повторить ошибки</button>':''}</div>`:''}`;
      attachCommon(key);
      main.querySelectorAll('[data-choice]').forEach(el=>el.addEventListener('click',()=>{
        if(state.answers[q.id]?.checked)return;
        state.answers[q.id]={choice:Number(el.dataset.choice),checked:false};render();
      }));
      document.getElementById('refresh-wording')?.addEventListener('click',()=>{refreshWording(q.id);render();});
      document.getElementById('check')?.addEventListener('click',()=>{
        const r=state.answers[q.id];if(!r||r.checked||r.choice===undefined)return;r.checked=true;render();
      });
      document.getElementById('next')?.addEventListener('click',()=>{
        state.cursor[key]=last?0:state.cursor[key]+1;render();
      });
      document.getElementById('prev')?.addEventListener('click',()=>{state.cursor[key]=Math.max(0,state.cursor[key]-1);render();});
      main.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>{state.cursor[key]=Number(el.dataset.go);render();}));
      document.getElementById('toggle-errors')?.addEventListener('click',()=>{
        if(!state.errorsOnly[key]&&!stats.bad)return;
        state.errorsOnly[key]=!state.errorsOnly[key];state.cursor[key]=0;render();
      });
      document.getElementById('repeat-wrong')?.addEventListener('click',()=>{
        const firstWrong=state.order[key].find(id=>state.answers[id]?.checked&&state.answers[id]?.choice!==byId[id].correct);
        if(!firstWrong)return;
        for(const id of state.order[key])if(state.answers[id]?.checked&&state.answers[id]?.choice!==byId[id].correct){delete state.answers[id];refreshWording(id);}
        state.errorsOnly[key]=false;state.cursor[key]=state.order[key].indexOf(firstWrong);render();toast('Ошибочные ответы сброшены. Можно попробовать снова.');
      });
    }
    function attachCommon(key){
      document.getElementById('reshuffle')?.addEventListener('click',()=>{
        state.order[key]=shuffle(state.order[key]);
        if(key!=='one'){
          state.cursor[key]=0;
          state.errorsOnly[key]=false;
          for(const item of datasets[key]){state.optionOrder[item.id]=shuffle([0,1,2,3]);refreshWording(item.id);}
        }
        render();toast('Вопросы перемешаны в текущем разделе.');
      });
      document.getElementById('reset-section')?.addEventListener('click',()=>{
        if(!confirm('Сбросить все ответы в этом разделе и начать новую попытку?'))return;
        for(const item of datasets[key])delete state.answers[item.id];
        state.order[key]=shuffle(state.order[key]);
        for(const item of datasets[key]){state.optionOrder[item.id]=shuffle([0,1,2,3]);refreshWording(item.id);}
        state.errorsOnly[key]=false;state.cursor[key]=0;render();toast('Новая попытка начата.');
      });
    }
    function render(){
      persist();renderSidebar();
      if(state.section==='one'){renderOne();attachCommon('one')}else renderQuiz(state.section);
    }
    document.querySelectorAll('.nav-button').forEach(el=>el.addEventListener('click',()=>{
      state.section=el.dataset.section;render();
      if(window.matchMedia('(max-width:900px)').matches)main.scrollIntoView({behavior:'smooth',block:'start'});
    }));
    document.addEventListener('keydown',e=>{
      if(state.section==='one'||e.altKey||e.ctrlKey||e.metaKey)return;
      if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;
      const key=state.section;const ids=shownIDs(key);const q=byId[ids[state.cursor[key]]];if(!q)return;
      const ans=state.answers[q.id];
      if(/^[1-4]$/.test(e.key)&&!ans?.checked){e.preventDefault();state.answers[q.id]={choice:state.optionOrder[q.id][Number(e.key)-1],checked:false};render();}
      else if(e.key==='Enter'&&!e.repeat&&document.activeElement===document.body){
        if(!ans?.checked&&ans?.choice!==undefined){state.answers[q.id].checked=true;render();}
      }
    });
    render();
  })();
  </script>
</body>
</html>
