  <div class="app">
    <header class="masthead">
      <div class="mast-inner">
        <div class="eyebrow"><span class="dot"></span> Backend interview prep</div>
        <h1>102 вопроса. Одно уверенное интервью.</h1>
      </div>
    </header>
    <div class="layout">
      <div class="top-tools">
        <nav class="section-tabs" aria-label="Разделы теста">
          <button type="button" class="nav-button active" data-section="one" aria-current="page"><span class="nav-icon">01</span><span class="nav-name">Опыт и проекты</span></button>
          <button type="button" class="nav-button" data-section="two"><span class="nav-icon">02</span><span class="nav-name">Техническая база</span></button>
          <button type="button" class="nav-button" data-section="three"><span class="nav-icon">03</span><span class="nav-name">Computer Science</span></button>
        </nav>
        <details class="stats-dropdown" id="stats-toggle">
          <summary>▤ Прогресс <span class="caret" aria-hidden="true">⌄</span></summary>
          <div class="panel stats-popover" id="sidebar-stats"></div>
        </details>
      </div>
      <main id="main-content" aria-live="polite"></main>
    </div>
    <footer class="site-footer">Независимый тренажёр, не официальный тест Astana Hub · Прогресс хранится только в вашем браузере · Работает без интернета</footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
// Данные теста. В каждом вопросе ровно четыре варианта и один верный ответ.
const sectionOne = [
'Расскажите о себе, своём образовании и профессиональном опыте в разработке программного обеспечения.',
'Какие языки программирования, фреймворки и технологии вы используете в работе? Почему выбрали Python?',
'Какие задачи вы решаете в Литрес и за какие компоненты системы отвечаете?',
'Чем отличается ваша текущая работа от предыдущей работы в GipnoTech / The Deep VR?',
'Какие самые сложные технические проблемы вам приходилось решать и как вы находили решения?',
'Как вы проектируете архитектуру нового бэкенд-сервиса? Какие факторы учитываете при выборе технологий?',
'Как вы проектируете REST API? Какие подходы используете для обеспечения совместимости, безопасности и масштабируемости?',
'Какие преимущества и недостатки Django, Django REST Framework и FastAPI вы можете выделить на основе своего опыта?',
'Как организуете взаимодействие между несколькими сервисами? Как обеспечиваете надёжность интеграций?',
'Как вы принимаете архитектурные решения и оцениваете технические риски перед реализацией проекта?',
'Расскажите о проекте переноса ключевых авторов на платформу «Литрес: Авторы». В чём заключались основные технические сложности?',
'Как вы обеспечивали сохранность данных при миграции около 18 тысяч книг и предотвращали ошибки начисления роялти?',
'Как вы организовали миграцию системы публикации книг с Perl на Python? Почему использовали поэтапное переключение?',
'Какие механизмы отката и мониторинга вы применяли при переносе функциональности на новый сервис?',
'Как вы обнаружили скрытые зависимости от устаревшей системы и предотвратили возможные инциденты после её отключения?',
'Расскажите, как вам удалось сократить количество SQL-запросов со 150 до 13. Какие инструменты и методы оптимизации вы использовали?',
'Как вы диагностируете проблемы производительности PostgreSQL и определяете, какие запросы нужно оптимизировать?',
'Как вы обнаружили и устранили утечку памяти в проекте GipnoTech?',
'Как вы организуете мониторинг ошибок, сбор логов, оповещения и анализ инцидентов в продакшене?',

  </script>
  <script>
  const answerVariations = {"two-0":[["Числа, строки, кортежи неизменяемы; списки, словари и множества изменяемы. У изменяемого объекта можно обновить содержимое без смены идентичности.","К неизменяемым типам относятся числа, str и tuple, а list, dict и set можно менять на месте, сохраняя тот же объект.","Строка, число и кортеж не меняют своё содержимое; список, множество и словарь допускают изменение без создания нового объекта.","Содержимое списков, словарей и множеств можно обновлять, не меняя идентификатор объекта; для чисел, строк и кортежей это невозможно."],["Числа и строки изменяемы, а списки и кортежи нет: изменяемость определяется наличием индексов.","Строки и числовые значения допускают изменение на месте, тогда как list и tuple неизменяемы, ведь всё зависит от индексируемости.","Признак изменяемости — поддержка доступа по индексу: поэтому числа и строки изменяемые, а списки с кортежами нет.","В Python изменять можно числа и str, но не list и tuple; решающим является наличие индексов у типа."],["Любой объект Python можно менять на месте, если переменная не объявлена константой.","Если имя не помечено как константа, объект любого типа можно отредактировать непосредственно.","В Python все объекты допускают модификацию на месте; препятствие возникает лишь для константных переменных.","Любое значение Python изменяемо, пока переменная не объявлена с запретом на присваивание."],["Изменяемость означает возможность менять тип объекта; неизменяемость — только запрет переназначать переменную.","Изменяемый объект может поменять свой тип, а неизменяемый означает, что переменную нельзя переназначить.","Под изменяемостью понимают замену типа значения; под неизменяемостью — невозможность привязать имя к другому объекту.","Изменяемость касается смены типа объекта, а неизменяемость запрещает переприсваивание соответствующей переменной."]],"two-1":[["Все четыре коллекции упорядочены и допускают повторяющиеся элементы; отличаются только синтаксисом.","Все перечисленные типы сохраняют порядок элементов, разрешают дубликаты и различаются только записью в коде.","У list, tuple, set и dict одинаковая семантика порядка и повторений; различие исключительно синтаксическое.","Любая из этих четырёх коллекций упорядочена и допускает повторяющиеся значения, поэтому выбирать можно по удобству синтаксиса."],["`list` и `tuple` хранят пары ключ–значение, а `set` и `dict` — последовательности.","Список и кортеж представляют пары «ключ — значение», а множество и словарь — линейные последовательности.","Для ассоциаций ключей со значениями используют list и tuple; set и dict применяют как последовательные контейнеры.","`list`/`tuple` — структуры ключ–значение, `set`/`dict` — обычные последовательности элементов."],["`list` — изменяемая последовательность, `tuple` — неизменяемая; `set` хранит уникальные хешируемые элементы, `dict` сопоставляет ключи значениям.","Список — изменяемая последовательность, кортеж — неизменяемая; множество содержит уникальные хешируемые значения, словарь отображает ключи в значения.","`list` подходит для изменяемого набора по порядку, `tuple` фиксирует последовательность, `set` исключает дубликаты, а `dict` хранит соответствия ключей и значений.","Для последовательности с изменениями выбирают list, для неизменяемой — tuple; уникальность обеспечивает set, а поиск значений по ключу — dict."],["`list` и `set` неизменяемы; `tuple` удобен для поиска по ключу, а `dict` — для работы с индексами.","`list` и `set` менять нельзя, зато `tuple` используют как словарь, а `dict` — для индексирования последовательностей.","Списки и множества неизменяемы; кортеж обеспечивает доступ по ключам, словарь предназначен для позиций в массиве.","List и set запрещают модификации, tuple создан для поиска по ключу, а dict организует индексы элементов."]],"two-2":[["`==` сравнивает типы объектов, `is` сравнивает только их строковое представление.","Оператор `==` сопоставляет классы значений, а `is` — их текстовое представление.","`==` устанавливает совпадение типов, `is` сравнивает результат преобразования объектов в строки.","Равенство по `==` означает одинаковый тип, а `is` — равную строковую форму значения."],["`==` обычно проверяет равенство значений, `is` — тождественность объектов (один ли это объект).","С помощью `==` обычно проверяют равенство содержимого, а `is` отвечает, указывают ли ссылки на один объект.","`==` сравнивает значения с учётом реализации равенства, `is` проверяет идентичность объектов.","Два экземпляра могут быть равны через `==`, но `is` будет True только при проверке одной и той же объектной идентичности."],["`is` сравнивает значения глубже, чем `==`, включая вложенные элементы контейнеров.","`is` выполняет более глубокую проверку содержимого, включая элементы внутри вложенных коллекций, чем `==`.","При сравнении `is` анализирует вложенные данные тщательнее оператора равенства.","Для рекурсивного сравнения контейнеров следует применять `is`, поскольку он глубже обычного `==`."],["Эти операторы взаимозаменяемы для неизменяемых объектов вроде строк и чисел.","Для строк и чисел, поскольку они неизменяемые, `==` можно без разницы заменить на `is`.","У неизменяемых значений операторы тождественности и равенства всегда дают одинаковый результат.","В случаях с int или str нет семантической разницы между `==` и `is`."]],"two-3":[["LEGB задаёт поиск Local → Enclosing → Global → Built-in; `global` ссылается на модульную переменную, `nonlocal` — на переменную внешней функции.","Имена ищутся последовательно в локальной, охватывающей, глобальной и встроенной областях; `global` относится к модулю, `nonlocal` — к внешней функции.","LEGB расшифровывается как Local, Enclosing, Global, Built-in; `global` привязывает имя к модульной области, `nonlocal` — к ближайшей подходящей внешней области функции.","Порядок разрешения имён: локальная функция → внешние функции → модуль → built-ins; объявления `global` и `nonlocal` выбирают нужную область для присваивания."],["LEGB задаёт поиск Global → Enclosing → Local → Built-in; `nonlocal` всегда обозначает глобальную переменную.","Сначала Python ищет имя в модуле, затем во внешней функции, локально и в built-ins; `nonlocal` отсылает к модулю.","В схеме LEGB первой считается глобальная область, а `nonlocal` обозначает глобальное имя.","Разрешение имён идёт Global → Enclosing → Local → Built-in; `nonlocal` используется для глобальных переменных."],["Область видимости у любой переменной одна — модульная; `global` только ускоряет поиск имени.","Любая переменная фактически принадлежит модулю, а запись `global` только делает доступ к ней быстрее.","Локальных переменных в Python по существу нет: имена живут в глобальной области, `global` служит оптимизацией.","Все имена Python доступны из области модуля; директива `global` влияет лишь на производительность поиска."],["`global` и `nonlocal` создают копии переменных в текущем вызове функции без изменения исходных.","Оба объявления создают временные локальные копии значений и не затрагивают переменные снаружи.","`global` и `nonlocal` дублируют внешнюю переменную в текущем вызове, оставляя оригинал неизменным.","При использовании `nonlocal` или `global` функция получает независимую копию имени без изменения внешнего состояния."]],"two-4":[["`*args` принимает только именованные аргументы, а `**kwargs` — только позиционные.","Через `*args` поступают только keyword-аргументы, через `**kwargs` — исключительно позиционные.","`*args` собирает именованные параметры, а `**kwargs` предназначен для дополнительных аргументов по позиции.","Именованные аргументы перехватывает `*args`, а позиционные — `**kwargs`."],["`*args` собирает дополнительные позиционные аргументы в кортеж, `**kwargs` — дополнительные именованные в словарь.","Лишние позиционные значения объединяются в tuple через `*args`, а дополнительные именованные — в dict через `**kwargs`.","`*args` принимает произвольное количество позиционных аргументов кортежем; `**kwargs` собирает пары имя–значение в словарь.","При определении функции `*args` аккумулирует позиции, `**kwargs` — ключевые параметры; результатом будут кортеж и словарь соответственно."],["Оба параметра всегда превращают аргументы в списки; различаются только скоростью доступа.","Оба механизма всегда формируют списки; различаются главным образом эффективностью доступа к собранным аргументам.","И `*args`, и `**kwargs` дают list, только скорость чтения элементов у них разная.","В обоих случаях дополнительные аргументы оказываются в списке, а различие между конструкциями — производительность."],["`*args` и `**kwargs` позволяют передавать аргументы только при вызове асинхронной функции.","Эти специальные параметры можно использовать только в `async def` или при вызове корутин.","Передача аргументов через звёздочки разрешена лишь для асинхронных функций.","Обычные синхронные вызовы не поддерживают `*args` и `**kwargs`: они предназначены для async-кода."]],"two-5":[["Декоратор изменяет исходный байткод функции перед её первым запуском, поэтому работает только при импорте.","Перед первым вызовом декоратор переписывает байткод исходной функции и действует только во время импорта.","Работа декоратора заключается в модификации байткода при импорте модуля, до запуска функции.","Декорирование — это изменение скомпилированных инструкций функции непосредственно перед её первым исполнением."],["Декоратор — вид наследования функций: он копирует методы базовой функции в дочернюю.","Декораторы реализуют наследование функций: методы родительской функции копируются в дочернюю.","Декорирование — особая форма subclassing, где одна функция наследует методы другой.","Механизм декораторов основан на переносе методов из базовой функции в новую, наследующую её."],["Декоратор принимает функцию или класс и возвращает объект, которым заменяется декорируемое имя; применяется для логирования, кэширования, контроля доступа.","Декоратор получает функцию либо класс и возвращает заменяющий объект; так добавляют кэширование, логирование или проверку доступа.","`@decorator` применяет вызываемый объект к функции/классу и привязывает результат к исходному имени — удобно для обёрток и сквозной логики.","Декоратор преобразует функцию или класс посредством другого callable, возвращая новое значение имени; типичные примеры — кэш, авторизация, логирование."],["Декораторы разрешены только для методов классов и не могут принимать аргументы.","Декорировать разрешено исключительно методы внутри классов, причём параметризованные декораторы невозможны.","Python не позволяет декораторам работать с обычными функциями и передавать собственные аргументы.","Декораторы поддерживаются только у методов и обязательно используются без параметров."]],"two-6":[["Итератор поддерживает `__next__` и `__iter__`; итерируемый объект предоставляет итератор, генератор — частный случай итератора с отложенным выполнением через `yield`.","Итерируемый объект умеет выдавать итератор, итератор реализует `__iter__` и `__next__`; генератор создаёт ленивые значения с помощью `yield`.","Итератор возвращает элементы по одному через `__next__`; iterable предоставляет такой итератор, а генератор — его лениво исполняемая разновидность.","`__iter__` делает объект итерируемым, `__next__` служит для продвижения итератора; генератор приостанавливает и возобновляет вычисления на `yield`."],["Итерируемый объект обязательно хранит все элементы в памяти, а итератор — обязательно вычисляет их заранее.","Iterable всегда размещает элементы сразу в RAM, а итератор обязан получить все значения до начала обхода.","Итерируемые структуры непременно содержат весь набор в памяти, а итератор заранее просчитывает результаты.","Для обоих механизмов обязательна предварительная материализация значений: iterable хранит их, iterator вычисляет заранее."],["Генератор — неизменяемая коллекция, а `yield` полностью завершает функцию и больше не позволяет продолжить выполнение.","Генератор представляет собой неизменяемый контейнер; `yield` окончательно прерывает его работу, не позволяя продолжить.","`yield` работает как необратимый `return`, а генератор — статическая неизменяемая коллекция.","После первого `yield` генератор завершается навсегда, поскольку является фиксированным контейнером."],["Итератор и итерируемый объект — синонимы, а генератор отличается только тем, что всегда работает асинхронно.","Итератор и iterable обозначают один объект, а генератор отличается от них только обязательной асинхронностью.","Это два названия одного механизма; генераторы работают исключительно как асинхронные итераторы.","Между итерируемым объектом и итератором нет различия, генераторы же всегда используют `async`."]],"two-7":[["`with` заменяет обработку исключений и автоматически подавляет любое исключение в блоке.","Конструкция `with` перехватывает и подавляет все исключения внутри блока, поэтому `try` больше не требуется.","Любая ошибка в `with` автоматически игнорируется, что заменяет отдельную обработку исключений.","Контекстный менеджер безусловно скрывает исключения, происходящие внутри `with`."],["`__enter__` освобождает ресурс перед входом, `__exit__` создаёт ресурс после выхода.","`__enter__` сначала освобождает ресурс, а `__exit__` создаёт новый при выходе из блока.","При входе контекстный менеджер закрывает ресурс, а при завершении блока открывает его вновь.","Начальный метод `__enter__` выполняет очистку, конечный `__exit__` отвечает за получение ресурса."],["`with` работает только с файлами, а пользовательские контекстные менеджеры создать нельзя.","Оператор `with` разрешён лишь для файлов; реализовать собственный объект с этим протоколом нельзя.","Пользовательские контекстные менеджеры в Python не поддерживаются: `with` предназначен для файловых дескрипторов.","`with` — специальная конструкция только для операций открытия файлов, не расширяемая классами."],["`with` управляет входом и выходом из контекста; `__enter__` подготавливает ресурс, `__exit__` вызывается при выходе, в том числе при исключении.","`with` оформляет ресурсный контекст: `__enter__` выполняет вход, `__exit__` — выход, даже если внутри возникла ошибка.","Объект контекстного менеджера подготавливается при `__enter__` и получает вызов `__exit__` по завершении блока, включая исключения.","Оператор `with` обеспечивает парные действия при входе и выходе; завершающий метод вызывается также при аварийном выходе из тела блока."]],"two-8":[["`copy` копирует вложенные объекты рекурсивно, а `deepcopy` создаёт ссылки на существующие.","Обычный `copy` рекурсивно дублирует вложенные данные, а `deepcopy` оставляет на них ссылки оригинала.","Поверхностное копирование обновляет всю вложенную структуру, глубокое — лишь внешний контейнер.","`copy` полностью создаёт новые дочерние объекты, тогда как `deepcopy` повторно использует исходные вложения."],["`copy` создаёт новый внешний контейнер, обычно оставляя ссылки на вложенные объекты; `deepcopy` рекурсивно копирует вложенные объекты.","Поверхностная копия содержит новый внешний объект и общие ссылки на вложенные элементы; глубокая пытается копировать вложенные объекты рекурсивно.","`copy` воспроизводит верхний уровень контейнера, сохраняя ссылки внутрь; `deepcopy` проходит по вложенной структуре и дублирует её элементы.","Если скопировать список списков через `copy`, внутренние списки будут общими; `deepcopy` обычно создаст независимые внутренние объекты."],["Оба способа создают идентичные ссылки на оригинал; отличаются только временем выполнения.","Оба вызова возвращают ту же ссылку на исходник, но один занимает больше времени.","`copy` и `deepcopy` не создают самостоятельных объектов; отличаются лишь затратами времени.","Независимо от выбранной функции результат указывает на оригинал, просто глубокое копирование медленнее."],["`deepcopy` запрещён для изменяемых объектов, потому что может нарушить их идентичность.","Для изменяемых объектов `deepcopy` использовать запрещено, так как он нарушает объектную идентичность.","Глубокое копирование допускается только для immutable-объектов, иначе возникает ошибка идентичности.","`deepcopy` нельзя применять к спискам или словарям из-за риска потери идентичности элементов."]],"two-9":[["Значение по умолчанию вычисляется при каждом вызове функции и иногда случайно совпадает со старым.","Значение по умолчанию пересоздаётся при каждом вызове, но иногда совпадает с результатом прежнего вызова.","Python вычисляет default-аргумент заново для каждого обращения; ошибки возникают из-за случайного совпадения значений.","При каждом вызове функции создаётся отдельный объект по умолчанию, а повторный результат — случайность."],["Python принудительно замораживает такие объекты после первого вызова, поэтому возникает исключение.","После первого вызова интерпретатор делает изменяемый default-объект неизменяемым, поэтому следующая запись вызывает исключение.","Python замораживает список или словарь по умолчанию после первого использования.","Изменение аргумента по умолчанию запрещается после первого запуска функции: объект автоматически блокируется."],["Объект по умолчанию создаётся при определении функции и может повторно использоваться между вызовами, сохраняя нежелательные изменения.","Default-выражение вычисляют один раз при создании функции; поэтому общий список или словарь способен накопить изменения из предыдущих вызовов.","Изменяемое значение по умолчанию разделяется между вызовами одной функции и может сохранять добавленные ранее элементы.","Если в определении функции стоит `[]`, список создаётся при определении, а затем повторно используется при вызовах, сохраняя мутации."],["Проблема встречается лишь в многопоточных программах, когда два вызова идут одновременно.","Опасность появляется только при одновременной работе нескольких потоков; последовательные вызовы безопасны.","Ошибка с изменяемыми default-параметрами характерна исключительно для конкурентных вызовов.","В однопоточной программе такой аргумент проблем не вызывает, поскольку нет состязания потоков."]],"two-10":[["GIL ограничивает одновременное исполнение Python-байткода в типичной сборке CPython; потоки полезны для I/O, а для CPU-задач нередко выбирают процессы.","В стандартной сборке CPython GIL не позволяет нескольким потокам одновременно выполнять Python-байткод; I/O выигрывает от потоков, CPU — часто от процессов.","Глобальная блокировка интерпретатора обычно сериализует исполнение Python-кода потоками; для вычислений на ядрах используют multiprocessing.","При обычном GIL потоки CPython не исполняют Python-байткод параллельно, хотя могут перекрывать ожидание ввода-вывода."],["GIL запрещает создавать несколько потоков, поэтому `threading` фактически выполняет задачи последовательно.","Из-за GIL в Python запрещено создавать более одного потока, так что threading всегда последовательно исполняет все действия.","GIL не позволяет иметь несколько потоков в приложении; формально доступный threading лишь имитирует их.","`threading` под GIL не поддерживает реальные потоки, а просто выполняет задачи строго по очереди."],["GIL гарантирует потокобезопасность всех структур данных и устраняет необходимость в блокировках.","GIL делает все операции с объектами автоматически безопасными для потоков, дополнительная синхронизация не нужна.","Благодаря GIL гонок данных в Python не бывает и локи никогда не требуются.","Любые изменения любых структур данных в CPython потокобезопасны из-за глобальной блокировки."],["GIL — ограничение ОС на число потоков; в любой реализации Python он работает одинаково.","GIL устанавливается операционной системой на число потоков и одинаково ограничивает все реализации языка.","Любой Python-интерпретатор наследует GIL как системный лимит потоков.","Эта блокировка — свойство ОС, поэтому CPython, PyPy и другие реализации используют идентичный GIL."]],"two-11":[["Потоки и процессы всегда используют отдельную память, а `asyncio` создаёт новый поток для каждой задачи.","И потоки, и отдельные процессы обладают независимой памятью; корутины asyncio автоматически запускаются в собственном потоке.","Для каждого потока выделяется адресное пространство, как и для процесса, а Event Loop создаёт потоки под async-задачи.","Все три модели отделяют память задач; `asyncio` использует отдельный OS-thread на корутину."],["Потоки разделяют память процесса, процессы имеют раздельные адресные пространства, `asyncio` обычно переключает корутины кооперативно в одном потоке.","Потоки одного процесса видят общую память, у процессов память обычно раздельная, а asyncio кооперативно планирует корутины, чаще в одном потоке.","Threading разделяет адресное пространство между потоками; multiprocessing создаёт процессы, asyncio переключается между задачами на точках ожидания.","Потоки совместно используют данные процесса, процессы изолируются, а асинхронный цикл событий обычно управляет многими корутинами без отдельного потока для каждой."],["`asyncio` обеспечивает параллельное выполнение CPU-вычислений на всех ядрах без процессов.","Asyncio распределяет тяжёлые вычисления по всем ядрам процессора без multiprocessing.","Для CPU-bound задач одного Event Loop достаточно, чтобы задействовать несколько ядер параллельно.","Корутины в asyncio сами по себе исполняют процессорный код одновременно на всех ядрах."],["Многопоточность работает только для CPU-задач, а многопроцессность — только для сетевых операций.","Потоки применимы исключительно к вычислениям, а процессы — лишь к сетевому вводу-выводу.","Для CPU-нагрузки предусмотрен только threading, а multiprocessing нужен для запросов к сети.","Многопоточная модель пригодна только для CPU, многопроцессная — только для I/O."]],"two-12":[["Event Loop создаёт новый процесс для каждой корутины; `await` блокирует весь процесс до её завершения.","Event Loop запускает процесс для каждой асинхронной функции, а `await` останавливает все остальные задачи до её завершения.","Каждая корутина исполняется в отдельном процессе; на `await` вся программа блокируется.","Цикл событий разворачивает процессы, а ожидание через `await` приостанавливает весь интерпретатор."],["`async` помечает функцию как потокобезопасную, а `await` выполняет её синхронно до конца.","`async` означает потокобезопасность, а `await` принудительно выполняет функцию полностью синхронно.","Асинхронное объявление автоматически защищает код от гонок, но `await` не допускает переключения задач.","Ключевое слово `async` гарантирует thread-safe, `await` блокирует поток до конца исполнения функции."],["Event Loop планирует выполнение асинхронных задач; `async def` задаёт корутину, а `await` позволяет уступить управление в ожидании awaitable.","Event Loop координирует асинхронные задачи; `async def` объявляет корутинную функцию, `await` передаёт управление при ожидании асинхронной операции.","Цикл событий решает, когда возобновлять корутины; `await` позволяет другим задачам выполняться, пока текущая ждёт awaitable.","Корутинные функции создаются через `async def`, их исполнение планирует Event Loop, а `await` служит точкой кооперативного ожидания."],["Event Loop автоматически превращает любой блокирующий вызов в неблокирующий.","Любой обычный блокирующий вызов автоматически становится асинхронным, если приложение работает в Event Loop.","Цикл событий способен сам сделать неблокирующими `time.sleep()` и синхронные сетевые функции.","Event Loop автоматически адаптирует всю синхронную работу с I/O к async без изменений кода."]],"two-13":[["I/O-bound задачи тратят основное время на вычисления, а CPU-bound — на ожидание сети или диска.","I/O-bound означает преимущественно нагрузку на процессор, CPU-bound — простаивание при ожидании диска и сети.","Термин I/O-bound описывает вычислительно тяжёлые задачи, а CPU-bound — операции, зависящие от внешних устройств.","Если программа тратит время на вычисления, это I/O-bound, а на запросы к сети — CPU-bound."],["I/O-bound задачи ограничены ожиданием внешних операций, CPU-bound — вычислениями; первым подходят async/потоки, вторым нередко процессы.","I/O-bound задачи ограничивает ожидание операций ввода-вывода, CPU-bound — скорость вычислений; для первых подходят корутины или потоки, для вторых — процессы.","Когда тормозит сеть или диск, помогает конкурентный I/O; когда вычисления нагружают ядро, полезен параллелизм процессов.","Асинхронность/потоки обычно эффективны для задач с ожиданием, multiprocessing — для интенсивных расчётов в обычном CPython."],["Оба типа задач одинаково ускоряются увеличением числа Python-потоков в обычном CPython.","И сетевые ожидания, и тяжёлые вычисления одинаково ускоряются добавлением потоков CPython.","Достаточно увеличить число Python threads, чтобы ускорить оба класса задач в одинаковой степени.","Обычный CPython прекрасно распараллеливает любой тип нагрузки потоками, независимо от I/O или CPU."],["CPU-bound задачи всегда выполняются быстрее через `asyncio`, поскольку Event Loop использует все ядра.","Для процессорных вычислений быстрее всего asyncio, ведь Event Loop автоматически распределяет их по ядрам.","CPU-bound задачи стоит запускать в корутинах: цикл событий задействует все процессоры.","Вычислительно сложный код масштабируется с помощью одного asyncio loop за счёт работы на нескольких ядрах."]],"two-14":[["В CPython память освобождается исключительно при завершении процесса; подсчёт ссылок нужен лишь для диагностики.","В CPython выделенные объекты остаются до завершения программы; счётчик ссылок служит только для профилирования.","Память освобождается лишь при остановке интерпретатора, подсчёт ссылок не участвует в удалении объектов.","Даже при отсутствии ссылок CPython держит любой объект до конца процесса, а refcount нужен для диагностики."],["Python собирает мусор только по таймеру и не использует количество ссылок на объект.","Python проверяет необходимость сборки мусора только по расписанию, не отслеживая ссылки между объектами.","Управление памятью Python основано исключительно на периодическом таймере сборщика, счётчиков ссылок нет.","Сборщик раз в заданный интервал удаляет объекты, не анализируя число ссылок."],["В CPython большинство объектов освобождается при обнулении счётчика ссылок; отдельный сборщик обнаруживает циклические ссылки.","В CPython при исчезновении последней ссылки объект обычно освобождается, а отдельный GC помогает собирать циклы.","Подсчёт ссылок управляет временем жизни большинства объектов CPython; циклические зависимости обрабатывает дополнительный сборщик.","Refcount позволяет уничтожить объект при нуле ссылок, но для взаимно ссылающихся недостижимых объектов нужен циклический GC."],["Сборщик мусора всегда немедленно удаляет объект при выходе переменной из области видимости во всех реализациях Python.","Во всех реализациях Python любой объект удаляется немедленно, как только локальная переменная выходит из области видимости.","Сборка мусора у Python всегда синхронная и мгновенная при выходе из функции, независимо от ссылок.","Завершение области видимости гарантирует моментальное уничтожение объекта на любой реализации языка."]],"two-15":[["Model определяет данные и работу с ними, View обрабатывает запрос и формирует ответ, Template отвечает за представление; Django обычно описывают как MTV.","Django разделяет данные и доступ к ним в Model, обработку запросов — во View, шаблонное представление — в Template; это архитектура MTV.","В шаблонах Django задают отображение, во view формируют ответ, в model описывают данные; такое разделение называют Model–Template–View.","MTV в Django: модели отвечают за предметные данные, представления обрабатывают HTTP, шаблоны рендерят вывод."],["Model отвечает за HTML, View — за структуру БД, Template — за маршрутизацию.","Модель генерирует HTML, View содержит определения таблиц, а Template выбирает обработчики URL.","За верстку отвечает Model, за базу данных View, за маршруты Template.","В Django обязанности таковы: HTML в моделях, схема БД во views, URL-маршрутизация в шаблонах."],["Model хранит бизнес-логику только в браузере, View генерирует миграции, Template общается с ORM.","Модели выполняются исключительно в браузере, Views производят миграции, а Templates запускают ORM-запросы.","Бизнес-правила модели живут на клиенте; view обновляет схему, template взаимодействует с базой.","Model — только браузерная логика, View — генератор миграций, Template — интерфейс к ORM."],["Django не разделяет обработку запроса, данные и представление — всё размещается в одном контроллере.","В Django все функции приложения располагаются в одном контроллере без отдельного слоя данных или шаблонов.","Фреймворк не различает модели, обработку запросов и отображение: всё объединено в один компонент.","Разделения Model/View/Template у Django нет, всё реализуется контроллером."]],"two-16":[["`select_related` загружает M2M через отдельные запросы, `prefetch_related` работает только с ForeignKey через JOIN.","`select_related` делает отдельные запросы для M2M, тогда как `prefetch_related` использует JOIN лишь для FK.","Many-to-many загружают `select_related` через отдельные выборки, а ForeignKey — `prefetch_related` через JOIN.","`select_related` ориентирован на связи M2M и допзапросы; `prefetch_related` применяется только к одиночным FK с JOIN."],["ORM заменяет SQL языком шаблонов; оба метода полностью отключают дополнительные запросы при любых обращениях к связям.","ORM полностью заменяет SQL шаблонным языком, а оба метода запрещают дополнительные запросы при любом последующем обращении к связям.","После `select_related` или `prefetch_related` никакие новые запросы к базе невозможны, потому что ORM использует язык шаблонов.","ORM генерирует не SQL, а шаблоны; методы предзагрузки гарантированно устраняют все обращения к базе."],["`select_related` использует SQL JOIN для подходящих одиночных связей, `prefetch_related` делает дополнительные запросы и объединяет результаты в Python; оба помогают устранить N+1.","`select_related` объединяет подходящие FK/OneToOne через SQL JOIN; `prefetch_related` загружает связи отдельными запросами и связывает объекты в Python, помогая против N+1.","При `select_related` связанные одиночные объекты попадают в один JOIN-запрос, при `prefetch_related` выполняются дополнительные выборки; оба могут снизить число запросов.","Для одиночных связей обычно используют `select_related` с JOIN, для обратных/M2M — `prefetch_related` с отдельной загрузкой, чтобы не запросить БД N раз."],["N+1 — это ситуация, когда один SQL-запрос возвращает N+1 столбцов, а не несколько запросов.","N+1 означает, что одна выборка SQL содержит на один столбец больше ожидаемого количества N.","Проблема N+1 связана с числом колонок результата одного запроса, а не с количеством запросов.","Термин N+1 описывает дополнительный столбец в одной SQL-строке при работе ORM."]],"two-17":[["Middleware — обработчики только после обращения к БД, не имеющие доступа к HTTP-запросу.","Django middleware вызываются лишь после обращения к базе и не могут видеть входящий HTTP-запрос.","Промежуточный слой исполняется исключительно после SQL-операций, без доступа к request.","Middleware в Django обрабатывает результаты запросов к БД, но не сами веб-запросы."],["Middleware — слой вокруг обработки запроса и ответа: может выполнить логику до View, после неё и при обработке исключений.","Middleware оборачивает путь HTTP-запроса и ответа, позволяя выполнять код до и после View, а также участвовать в обработке ошибок.","Это сквозные обработчики Django: они перехватывают входящий запрос и исходящий ответ, включая особые случаи исключений.","Между веб-сервером и View располагаются middleware, которые выполняют предварительную и завершающую логику вокруг обработки запроса."],["Middleware запускается только при старте сервера и сохраняет настройки в памяти.","Middleware запускаются однократно при инициализации приложения и затем лишь хранят конфигурацию.","Промежуточные компоненты Django работают только во время старта сервера, а не на каждом HTTP-запросе.","Назначение middleware — задать параметры запуска один раз, не участвуя в request/response."],["Middleware — механизм миграций, выполняемый при каждом изменении схемы базы.","Middleware отвечает за обновление схемы базы и вызывается при создании каждой миграции.","Этот механизм нужен для миграций таблиц, а не для обработки HTTP.","Django выполняет middleware только при изменениях моделей и применении миграций."]],"two-18":[["WSGI и ASGI одинаково описывают только HTTP/1.1 и не влияют на поддержку асинхронного кода.","Оба интерфейса обслуживают только HTTP/1.1 и не затрагивают особенности синхронного или асинхронного исполнения.","WSGI и ASGI описывают одну и ту же синхронную модель работы с HTTP/1.1.","Разницы в поддержке асинхронности между WSGI и ASGI нет, оба ограничены первым HTTP."],["WSGI — интерфейс для синхронных Python-веб-приложений; ASGI поддерживает асинхронные соединения и протоколы вроде WebSocket.","WSGI стандартизирует взаимодействие синхронного Python-приложения и сервера; ASGI рассчитан также на асинхронные сценарии, включая WebSocket.","ASGI расширяет возможности интерфейса сервер–приложение для асинхронной работы и долгих соединений; WSGI ориентирован на синхронный HTTP.","Для традиционного синхронного Python-веба применяют WSGI, а для async и WebSocket обычно ASGI."],["ASGI — специальный формат JSON-ответов для API, а WSGI отвечает за SQL-транзакции.","ASGI задаёт JSON-структуру ответа, а WSGI занимается гарантиями SQL-транзакций.","За формат JSON в API отвечает ASGI; интерфейс WSGI управляет атомарностью запросов к БД.","ASGI — спецификация сериализации данных, WSGI — протокол взаимодействия с SQL-хранилищем."],["ASGI обязательно создаёт отдельный процесс для каждого запроса, а WSGI — единственный общий поток.","ASGI создаёт процесс для каждого HTTP-запроса, WSGI обслуживает все запросы строго в одном потоке.","При ASGI каждому клиенту выделяется ОС-процесс, при WSGI вся работа обязательно идёт последовательно.","ASGI не может переиспользовать процессы, WSGI не допускает более одного потока на весь сервер."]],"two-19":[["FastAPI опирается на type hints, Pydantic и декларативные зависимости; DRF тесно интегрирован с Django ORM, сериализаторами и Django-экосистемой.","FastAPI использует аннотации типов, валидацию Pydantic и DI, а DRF опирается на сериализаторы, ORM и другие компоненты Django.","Типизированные параметры и декларативное разрешение зависимостей — особенности FastAPI; DRF глубоко встроен в экосистему Django.","В FastAPI проверки схем обычно выполняет Pydantic, зависимости описывают через Depends; DRF тесно связан с Django и его ORM."],["FastAPI включает полноценную Django ORM из коробки, а DRF предназначен преимущественно для WebSocket.","FastAPI поставляется со встроенной Django ORM, тогда как DRF в первую очередь предназначен для WebSocket.","В FastAPI ORM Django входит по умолчанию, а основной сценарий DRF — работа с WebSocket-протоколом.","FastAPI уже содержит модели Django, а Django REST Framework главным образом реализует двусторонние WebSocket-подключения."],["В FastAPI Pydantic нужен только для работы с SQL, а внедрение зависимостей означает наследование от базового класса.","Pydantic в FastAPI нужен исключительно для SQL, а Dependency Injection означает наследование компонентов от общего класса.","Задача Pydantic — выполнять запросы к базе; DI сводится к построению иерархии классов.","FastAPI применяет Pydantic только как SQL-клиент, а внедрение зависимостей — это расширение базового класса."],["DRF не поддерживает валидацию входных данных, в отличие от FastAPI, поэтому каждый запрос приходится разбирать вручную.","В DRF отсутствуют средства проверки входных данных: их приходится реализовать самостоятельно, в отличие от FastAPI.","Django REST Framework не имеет механизма валидации, поэтому все значения API нужно проверять вручную.","DRF умеет маршрутизировать запросы, но не может валидировать сериализованные данные."]],"two-20":[["HTTP передаёт только JSON, запрос включает тело и токен, а статус ответа необязателен.","HTTP предназначен только для передачи JSON, запрос обязательно содержит токен и тело, а код ответа можно не указывать.","Протокол HTTP ограничен JSON; в запросе нужны body и ключ доступа, в ответе статус не обязателен.","HTTP не передаёт ничего, кроме JSON, при этом тело и токен запроса обязательны, статус ответа факультативен."],["HTTP — протокол прикладного уровня; запрос включает метод, цель запроса, заголовки и необязательное тело, а ответ — статус, заголовки и возможное тело.","HTTP работает на прикладном уровне; клиент передаёт метод, адрес назначения, заголовки и иногда тело, сервер возвращает статус, заголовки и при необходимости данные.","У HTTP-запроса есть метод, целевой ресурс, headers и необязательный body; ответ содержит код состояния, headers и возможный body.","Обмен HTTP состоит из запроса (method, target, headers, optional body) и ответа (status, headers, optional body); это протокол прикладного уровня."],["HTTP работает исключительно поверх UDP, поэтому приложения обязаны сами реализовать доставку.","Любой HTTP-обмен возможен только через UDP, поэтому приложение само гарантирует доставку.","HTTP не использует TCP и всегда требует реализации надёжности поверх UDP на стороне сайта.","Транспорт HTTP исключительно UDP; повторную передачу и подтверждение пакетов должен обеспечивать веб-код."],["HTTP-запрос и HTTP-ответ обязаны иметь тело, даже при GET или статусе 204.","Даже у GET-запроса и ответа 204 обязательно должно быть содержимое в body.","Тело сообщения необходимо в каждом HTTP-запросе и HTTP-ответе, включая статусы без содержимого.","Протокол не допускает пустое тело: при GET и коде 204 всё равно передаются данные."]],"two-21":[["GET обычно читает ресурс, POST инициирует обработку/создание, PUT заменяет представление по URI, PATCH частично изменяет, DELETE удаляет; идемпотентность зависит от семантики метода.","GET запрашивает представление, POST запускает обработку или создание, PUT задаёт замену ресурса, PATCH — частичное обновление, DELETE — удаление; некоторые методы идемпотентны.","Семантика методов: GET — чтение, POST — обработка/создание, PUT — замена состояния по адресу, PATCH — частичная правка, DELETE — удаление; повторяемость эффекта зависит от метода.","HTTP использует GET для получения, POST для передачи на обработку, PUT для полной замены, PATCH для частичных изменений и DELETE для удаления; идемпотентность определяется стандартом."],["GET и POST оба идемпотентны по стандарту, а PUT и DELETE никогда не бывают идемпотентными.","По спецификации POST идемпотентен так же, как GET, тогда как DELETE и PUT при повторе обязаны менять результат.","GET и POST гарантированно имеют одинаковый эффект при повторе; PUT и DELETE никогда не обладают этим свойством.","PUT/DELETE обязательно неидемпотентны, а GET/POST всегда идемпотентны."],["PUT предназначен только для добавления элементов в массив, PATCH — только для полного перезаписывания документа.","PUT разрешает лишь добавлять элементы в коллекцию, а PATCH требует заменить документ целиком.","Для добавления значений в массив предназначен PUT; для полной перезаписи ресурса — PATCH.","PATCH полностью заменяет ресурс, а PUT не умеет ничего, кроме append в массив."],["DELETE гарантирует физическое удаление записи из БД, GET всегда запрещает любые параметры.","DELETE должен удалить строку физически из таблицы, а GET не может включать query-параметры.","HTTP DELETE всегда означает физическое стирание данных, GET не допускает параметров в URL.","На DELETE сервер обязан безвозвратно удалить запись в БД; у GET нет поддержки query string."]],"two-22":[["1xx — ошибки клиента, 2xx — перенаправления, 3xx — успех, 4xx — ошибки сервера, 5xx — информационные ответы.","Коды 1xx обозначают клиентские ошибки, 2xx — редиректы, 3xx — успешность, 4xx — сбой сервера, 5xx — информацию.","Классы статусов идут так: 1xx ошибки клиента, 2xx перенаправления, 3xx успех, 4xx ошибки сервера, 5xx информирование.","HTTP относит ошибки пользователя к 1xx, редиректы к 2xx, успех к 3xx, серверные сбои к 4xx и уведомления к 5xx."],["1xx — информационные, 2xx — успешные, 3xx — перенаправления, 4xx — ошибки со стороны клиента, 5xx — ошибки со стороны сервера.","Диапазоны статусов HTTP: 1xx информационные, 2xx успешные, 3xx редиректы, 4xx клиентские ошибки, 5xx серверные ошибки.","Ответы 100-х кодов сообщают информацию, 200-х — об успехе, 300-х — о перенаправлении, 400-х — об ошибке клиента, 500-х — сервера.","Статусы группируются по первой цифре: 1 — информация, 2 — успех, 3 — перенаправление, 4 — проблема запроса клиента, 5 — сбой на стороне сервера."],["1xx — успех, 2xx — информационные, 3xx — ошибки клиента, 4xx — перенаправления, 5xx — серверные ошибки.","Сотые коды означают успех, двухсотые — служебную информацию, трёхсотые — ошибку пользователя, четырёхсотые — редирект, пятисотые — ошибку сервера.","HTTP считает 1xx успешным результатом, 2xx информацией, 3xx ошибкой клиента, 4xx перенаправлением, 5xx серверной ошибкой.","Последовательность значений: 1xx успех, 2xx сведения, 3xx клиентская ошибка, 4xx redirect, 5xx серверная ошибка."],["2xx и 3xx всегда означают ошибки, а 4xx и 5xx — успешное завершение операции.","Все ответы 2xx и 3xx являются ошибочными, а группы 4xx и 5xx сигнализируют успех.","Протокол трактует 200-е и 300-е как неудачу, а 400-е и 500-е как успешные операции.","Если пришёл 4xx или 5xx, запрос выполнен успешно; 2xx/3xx показывают ошибку."]],"two-23":[["REST — любой API, возвращающий JSON; идемпотентность означает, что ответ никогда не меняется.","Любой JSON API автоматически REST, а идемпотентность означает неизменный текст каждого ответа.","REST определяют только по JSON-формату, повторяемость запроса — по полному совпадению response.","Если API отвечает JSON, он RESTful; идемпотентный запрос обязан возвращать один и тот же ответ байт в байт."],["REST предполагает клиент-серверное разделение, отсутствие состояния сеанса на сервере, кэшируемость, единый интерфейс и другие ограничения; идемпотентность означает одинаковый итоговый эффект повторного запроса.","REST строится на ограничениях вроде stateless, uniform interface, client-server и cacheability; идемпотентные повторы дают тот же итоговый эффект.","Архитектурный стиль REST предполагает разделение клиента и сервера, единый интерфейс, отсутствие серверного состояния сеанса и кэширование; идемпотентность относится к эффекту повторений.","REST задаёт набор архитектурных правил — например, клиент–сервер, stateless и единый интерфейс; идемпотентный метод после повтора оставляет систему в том же состоянии."],["REST требует только POST-запросов, а идемпотентность — обязательной уникальности идентификатора запроса.","REST разрешает использовать исключительно POST, а для идемпотентности каждому запросу нужен уникальный ID.","У REST все операции отправляются методом POST; идемпотентность — наличие неповторимого идентификатора.","Идемпотентность сводится к уникальному request-id, а REST API обязательно строят только на POST."],["REST гарантирует транзакционность между сервисами, а идемпотентность означает отсутствие сетевых ошибок.","REST автоматически обеспечивает распределённые транзакции, а идемпотентные запросы никогда не испытывают сетевых сбоев.","При REST транзакции между сервисами гарантированы архитектурой, и повторяемый запрос защищён от ошибок сети.","Идемпотентность отменяет риск потерь соединения, REST гарантирует атомарность вызовов разных сервисов."]],"two-24":[["Аутентификация определяет права, авторизация подтверждает личность; JWT всегда хранится на сервере в виде сессии.","Авторизация проверяет, кто вошёл, а аутентификация выдаёт права; JWT обязательно хранится сервером как сессия.","Проверка личности называется авторизацией, управление доступом — аутентификацией; любой JWT требует серверной записи сессии.","Аутентификация отвечает за permissions, авторизация — за identity, а JWT не может работать без хранения полного токена на сервере."],["Аутентификация подтверждает, кто пользователь, авторизация определяет его права; cookie может хранить идентификатор серверной сессии, JWT — подписанные утверждения.","Аутентификация устанавливает личность, авторизация проверяет разрешения; cookie часто несёт ID серверной сессии, а JWT содержит подписанные claims.","Сначала идентифицируют пользователя (authentication), затем проверяют его права (authorization); сессию можно связать с cookie, JWT передаёт подписанные утверждения.","Кто вы — вопрос аутентификации, что вам дозволено — авторизации; cookies могут хранить ключ сессии, JWT — самодостаточные подписанные данные."],["Cookies — исключительно механизм шифрования; сервер не может получать их с HTTP-запросом.","Cookie — не контейнер данных, а только алгоритм шифрования; браузер не прикладывает их к HTTP-запросам.","Cookies используются лишь для криптографии и никогда не пересылаются серверу.","Сервер не видит cookie в запросах: это сугубо браузерный механизм шифрования."],["JWT и серверная сессия означают одно и то же: оба требуют хранения полного токена в базе данных.","JWT и сессии устроены совершенно одинаково: нужно обязательно записать полный токен в БД.","Любая сессия и JWT предполагают серверное сохранение целого токена без исключений.","Использование JWT ничем не отличается от серверной сессии — и там, и там обязателен полный токен в базе."]],"two-25":[["CORS — политика браузера для междоменных запросов; CSRF — злоупотребление авторизованным запросом от имени пользователя; XSS — внедрение исполняемого скрипта.","CORS задаёт браузерные ограничения междоменных запросов, CSRF заставляет браузер совершать авторизованное действие без согласия пользователя, XSS внедряет выполняемый код в страницу.","CORS связан с контролем доступа к cross-origin ресурсам, CSRF — с подделкой запроса от лица вошедшего пользователя, XSS — с исполнением вредоносного JavaScript в контексте сайта.","CORS регулирует кросс-доменные запросы в браузере; при CSRF злоумышленник инициирует чужой аутентифицированный запрос, при XSS внедряет скрипт."],["CORS — способ шифрования паролей; CSRF — утечка памяти браузера; XSS — ограничение скорости API.","CORS используется для шифрования паролей, CSRF обозначает утечку памяти в браузере, XSS — лимитирование API.","CORS — криптографическая функция паролей; CSRF — утечка RAM клиента; XSS — механизм rate limit.","Пароли шифруют CORS, недостаток памяти называется CSRF, а ограничение частоты запросов — XSS."],["CORS полностью устраняет CSRF и XSS, если сервер выставляет заголовок `Access-Control-Allow-Origin: *`.","Заголовок `Access-Control-Allow-Origin: *` сам по себе полностью защищает и от CSRF, и от XSS.","Если открыть CORS всем источникам, браузер автоматически исключает XSS и CSRF.","Установка wildcard CORS является достаточной мерой от всех межсайтовых атак."],["CSRF и XSS — один тип атаки; обе предотвращаются исключительно настройкой HTTPS.","CSRF и XSS на самом деле одна и та же уязвимость; для её устранения достаточно включить HTTPS.","Эти два обозначения относятся к одному виду атаки, полностью нейтрализуемому TLS.","Различия между CSRF и XSS нет, обе проблемы исчезают при корректном сертификате HTTPS."]],"two-26":[["PostgreSQL хранит только JSON-документы, Redis — только таблицы, MongoDB — строго нормализованные связи.","PostgreSQL — исключительно документное JSON-хранилище, Redis реализует лишь таблицы, MongoDB — нормализованную реляционную схему.","В Postgres нельзя использовать таблицы, только JSON; Redis хранит реляционные таблицы; MongoDB требует нормализовать связи.","JSON-документы — единственная модель PostgreSQL; табличные данные — Redis, строгие нормальные формы — MongoDB."],["Все три системы являются реляционными и отличаются в основном SQL-диалектом.","PostgreSQL, Redis и MongoDB все относятся к реляционным SQL-СУБД и различаются лишь синтаксисом SQL.","Все три продукта используют реляционную модель, только диалекты запросов немного разные.","Это три варианта реляционной СУБД, различия между ними преимущественно в языке SQL."],["PostgreSQL — реляционная СУБД для структурированных запросов и транзакций; Redis — in-memory хранилище структур данных; MongoDB — документная база.","PostgreSQL — реляционная транзакционная база, Redis — хранилище структур данных преимущественно в памяти, MongoDB — документоориентированная СУБД.","Для структурированных отношений и SQL подходит PostgreSQL, для быстрых in-memory операций — Redis, для документов — MongoDB.","Postgres хранит связанные табличные данные с транзакциями; Redis ориентирован на структуры данных в RAM, MongoDB — на коллекции документов."],["Нереляционные базы не поддерживают индексы и не могут гарантировать долговечность записей.","NoSQL-хранилища не умеют индексировать поля и не способны обеспечивать долговременное сохранение данных.","У нереляционных БД нет индексов и гарантий сохранности записей после перезапуска.","Любая NoSQL-система не поддерживает ни индексацию, ни durable-хранение."]],"two-27":[["INNER возвращает совпадения; LEFT сохраняет все строки левой таблицы; RIGHT — правой; FULL — строки обеих сторон с NULL там, где пары нет.","INNER JOIN выбирает совпадающие пары; LEFT включает все строки слева, RIGHT — справа, FULL — обе стороны с NULL для отсутствующих совпадений.","При INNER остаются только пары по условию; LEFT и RIGHT сохраняют соответствующую сторону, FULL — записи обеих таблиц, дополняя пропуски NULL.","Внутреннее соединение возвращает пересечение по условию; внешние LEFT/RIGHT/FULL сохраняют левую, правую либо обе таблицы соответственно."],["INNER сохраняет все строки обеих таблиц, а LEFT и RIGHT возвращают только совпадающие.","INNER выдаёт все строки обеих таблиц, тогда как LEFT и RIGHT оставляют только пересечение.","Для получения полного объединения используют INNER, а для совпадающих пар — LEFT или RIGHT.","INNER сохраняет любые строки с двух сторон, LEFT/RIGHT не включают несовпадающие строки."],["LEFT возвращает только строки без пары, RIGHT — только строки с парой, FULL — их пересечение.","LEFT отдаёт исключительно непарные строки, RIGHT — только парные, FULL — лишь совпадающую область.","Левое соединение всегда исключает совпадения, правое — несовпадения, полное — объединяет только пересечение.","LEFT выбирает строки без соответствий, RIGHT — с соответствиями, FULL возвращает исключительно общие строки."],["FULL JOIN равнозначен CROSS JOIN и строит декартово произведение строк двух таблиц.","FULL JOIN формирует декартово произведение, то есть работает как CROSS JOIN.","Полное внешнее соединение эквивалентно CROSS и комбинирует каждую строку с каждой.","FULL и CROSS имеют одинаковую семантику всех возможных сочетаний строк."]],"two-28":[["Индекс — копия всей таблицы в оперативной памяти; он ускоряет любые запросы без затрат на запись.","Индекс — это полная копия таблицы в оперативной памяти, делающая любой запрос быстрее без накладных расходов на INSERT/UPDATE.","Чтобы ускорить запросы, индекс полностью дублирует таблицу в RAM и не требует обновления при записи.","Индексы всегда держат весь набор строк в памяти; поддержание их при изменениях таблицы бесплатно."],["Индекс — дополнительная структура поиска (например, B-tree): часто ускоряет выборки, но требует места и обновления при изменениях данных.","Индекс создаёт отдельную поисковую структуру, например B-tree, ускоряющую многие чтения, но увеличивающую расходы на хранение и запись.","Для быстрого поиска СУБД поддерживает дополнительные структуры индекса; при вставке и изменении данных их тоже приходится обновлять.","Индексация сокращает путь к подходящим строкам ценой места и работы при INSERT/UPDATE/DELETE."],["Индексы применяются только к числовым столбцам и всегда делают последовательное чтение ненужным.","Индексы разрешены только на числовых полях и гарантируют отказ от последовательного сканирования.","Символьные столбцы индексировать нельзя, а любой индекс полностью исключает seq scan.","СУБД применяет индексы исключительно к числам и всегда использует их вместо чтения всей таблицы."],["Создание индекса автоматически нормализует таблицу и устраняет необходимость в транзакциях.","Добавление индекса приводит таблицу к нормальной форме и делает транзакции неактуальными.","Индексация автоматически устраняет нарушения нормализации и заменяет транзакционное управление.","Создав индекс, можно не нормализовать данные и не использовать транзакции."]],"two-29":[["ACID — набор требований только к SQL-синтаксису: Aggregation, Consistency, Indexing, Distribution.","ACID расшифровывается как Aggregation, Consistency, Indexing, Distribution и описывает грамматику SQL.","Четыре слова ACID — агрегация, согласованность, индексация и распределение; это правила написания SQL.","Свойства ACID касаются синтаксиса запросов: Aggregation / Consistency / Indexing / Distribution."],["Транзакция гарантирует, что каждый запрос SQL выполняется параллельно и без блокировок.","Транзакция нужна, чтобы все SQL-команды работали одновременно и гарантированно не требовали блокировок.","Объединение запросов в транзакцию автоматически делает их параллельными и бесконфликтными.","В транзакции каждый запрос обязательно идёт параллельно остальным, без ожиданий и locks."],["ACID — Atomicity, Consistency, Isolation, Durability; транзакции объединяют взаимосвязанные изменения в согласованную единицу работы.","ACID — атомарность, согласованность, изолированность, долговечность; транзакция рассматривает набор изменений как единую логическую операцию.","Atomicity, Consistency, Isolation, Durability задают свойства транзакции, связывающей несколько действий над данными в одно целое.","Транзакции группируют взаимозависимые изменения, обеспечивая атомарность, соблюдение ограничений, изоляцию и сохранность зафиксированного результата."],["ACID исключает любые проблемы конкурентного доступа независимо от уровня изоляции.","Независимо от режима изоляции ACID гарантирует полное отсутствие любых конкурентных аномалий.","Если СУБД поддерживает ACID, условия гонок при любом уровне изоляции невозможны.","Транзакционные свойства автоматически исключают проблемы одновременных операций даже при Read Uncommitted."]],"two-30":[["Стандартные уровни: Read Uncommitted, Read Committed, Repeatable Read, Serializable; они различаются допустимыми аномалиями конкурентного чтения.","ANSI SQL описывает Read Uncommitted, Read Committed, Repeatable Read и Serializable; на разных уровнях различаются возможные аномалии чтения.","Классические четыре уровня изоляции — от Read Uncommitted до Serializable; каждый задаёт ограничения на видимость параллельных изменений.","Read Uncommitted / Read Committed / Repeatable Read / Serializable задают, какие эффекты конкурентных транзакций могут наблюдаться."],["Уровни — Fast, Normal, Safe и Strict; они определяют только скорость индексации.","Уровни изоляции называются Fast, Normal, Safe и Strict и описывают скорость работы индекса.","Настройка Fast/Normal/Safe/Strict нужна только для выбора производительности индексации.","СУБД предлагает четыре изоляции: Fast, Normal, Safe, Strict; они отвечают за скорость построения индексов."],["Грязное чтение — повторное чтение своих записей, фантомное — потеря соединения с БД.","Грязное чтение — повторное получение собственных изменений, фантомное — обрыв подключения к серверу.","Повторное чтение своих данных называется dirty read, а потеря сессии БД — phantom read.","Если транзакция видит свою запись второй раз, это грязное чтение; если пропала сеть, это фантомное."],["Уровень Serializable гарантирует отсутствие любых конфликтов без откатов транзакций.","Serializable не допускает конфликтов без необходимости откатывать какую-либо из транзакций.","При Serializable СУБД автоматически избегает всех конфликтов без рестартов транзакций.","Максимальная изоляция всегда обеспечивает безошибочное завершение любой транзакции, никогда не вызывая rollback."]],"two-31":[["`EXPLAIN ANALYZE` переписывает запрос в более оптимальную форму и сохраняет новую версию в БД.","`EXPLAIN ANALYZE` автоматически переписывает медленный SQL в оптимальный и сохраняет исправленный вариант.","Команда оптимизирует и заменяет текст запроса в базе, а не просто анализирует его.","Выполнение EXPLAIN ANALYZE сохраняет более быстрый SQL вместо исходного выражения."],["Команда показывает только синтаксические ошибки и не выполняет запрос.","Эта команда занимается лишь проверкой синтаксиса и не запускает SQL-запрос.","`EXPLAIN ANALYZE` без исполнения проверяет правильность написания запроса.","Данные о реальном исполнении не показываются, поскольку команда работает только как синтаксический валидатор."],["`EXPLAIN ANALYZE` выполняет запрос и показывает фактический план, время и число строк; анализируют сканирования, JOIN, сортировки и расхождение оценок.","`EXPLAIN ANALYZE` действительно исполняет запрос и показывает план с фактическими временами и строками; по нему оценивают scan, join, sort и ошибки оценок.","Реальный план исполнения, длительности шагов и количество строк доступны через EXPLAIN ANALYZE; это помогает выявлять узкие места.","Для диагностики SQL смотрят фактический план EXPLAIN ANALYZE: последовательные сканы, соединения, сортировки и отличие оценок от реальных значений."],["Команда всегда использует индекс и потому не подходит для анализа seq scan.","С `EXPLAIN ANALYZE` PostgreSQL принудительно применяет индексы, поэтому последовательное чтение таблицы невозможно исследовать.","Команда запрещает Seq Scan и всегда выбирает индексный план.","Анализ под EXPLAIN ANALYZE автоматически исключает full table scan, так что их не увидеть."]],"two-32":[["Кэширование — сохранение часто используемых результатов; стратегии включают cache-aside и write-through, а инвалидация нужна при изменении исходных данных.","Кэш сохраняет результаты для повторного использования; cache-aside и write-through — разные схемы заполнения, а после обновления исходных данных кэш может потребовать сброса.","Кэширование ускоряет повторный доступ, удерживая значения; стратегии отличаются путём чтения/записи, при изменении источника нужна инвалидация.","Часто запрашиваемые данные держат в кэше; например, cache-aside загружает при промахе, write-through пишет через кэш, устаревшее нужно обновлять."],["Кэш всегда служит единственным источником истины, поэтому устаревшие значения невозможны.","Кэш изначально является единственным источником достоверных данных, поэтому устареть в принципе не может.","Если есть кэш, основная БД не нужна и проблема stale data исключена.","Кэш всегда хранит актуальную истину, независимо от обновлений остальных систем."],["Write-through означает отложенную запись в БД после сброса кэша, а cache-aside — обязательную запись через кэш.","Write-through сначала откладывает запись в базу до вытеснения, а cache-aside требует записывать всё только через кэш.","При write-through обновления БД происходят исключительно после сброса кэша; при cache-aside все записи идут через него.","Write-through реализует отложенную запись, cache-aside — обязательный write path через кэш."],["Наличие TTL гарантирует, что данные в кэше всегда актуальны в каждый момент времени.","Достаточно поставить TTL, и значение не сможет быть устаревшим ни в один момент до истечения срока.","Время жизни записи полностью исключает stale reads на всём протяжении TTL.","Один TTL гарантирует строгую актуальность данных, даже если первоисточник уже изменился."]],"two-33":[["Очереди нужны только для прямых синхронных HTTP-вызовов; Kafka и RabbitMQ не хранят сообщения.","Очереди применяют только внутри синхронных HTTP-вызовов, а RabbitMQ и Kafka вообще не сохраняют сообщения.","Брокеры не имеют собственного хранения и работают лишь для непосредственных HTTP-запросов.","И RabbitMQ, и Kafka служат только прокси для синхронных вызовов без буферизации данных."],["RabbitMQ — брокер с маршрутизацией и очередями сообщений; Kafka — распределённый журнал событий с партициями и возможностью повторного чтения.","RabbitMQ ориентирован на доставку сообщений с очередями и маршрутизацией, а Kafka — на партиционированный журнал событий, который можно перечитывать.","В RabbitMQ сообщения маршрутизируются по очередям, в Kafka хранятся в partitioned log с управляемым повторным чтением.","Классический RabbitMQ используют как брокер задач/сообщений; Kafka хранит упорядоченные записи в партициях для потоковой обработки и replay."],["Kafka гарантирует глобальный порядок всех сообщений независимо от числа партиций.","Kafka всегда гарантирует единый общий порядок сообщений во всех партициях топика.","Независимо от partition count Kafka сохраняет глобальную последовательность всех записей.","У Kafka строгий общий order для любых сообщений топика, даже если они распределены по нескольким partitions."],["RabbitMQ обеспечивает хранение сообщений исключительно в PostgreSQL, а Kafka — только в памяти процесса.","RabbitMQ хранит всё только в PostgreSQL, Kafka держит все сообщения исключительно в оперативной памяти.","Данные RabbitMQ обязательно записывает в Postgres, а Kafka теряет свои логи при выключении RAM.","Единственное хранилище RabbitMQ — реляционная PostgreSQL, Kafka — лишь память текущего процесса."]],"two-34":[["Celery Worker назначает задачи по расписанию, Celery Beat выполняет их в отдельных потоках.","Celery Worker отвечает за расписание запуска, а Beat непосредственно исполняет задачи в фоновых потоках.","Планировщиком служит Worker, исполнителем запланированных действий — Beat.","Worker генерирует периодические задания, Beat их выполняет как отдельные потоки."],["Worker обрабатывает задачи, полученные через брокер; Beat периодически отправляет задания по расписанию в очередь.","Worker забирает задания из брокера и выполняет их; Beat публикует периодические задания по расписанию.","Обработку сообщений делает Celery Worker, а Celery Beat действует как scheduler, добавляя задачи в очередь.","В Celery исполнитель — Worker; компонент Beat в нужное время отправляет задачи в брокер."],["Celery Beat заменяет брокер сообщений, поэтому с ним RabbitMQ или Redis не нужны.","Beat целиком заменяет message broker, поэтому Redis и RabbitMQ с ним использовать не нужно.","Когда включён Celery Beat, брокер сообщений становится лишним.","Планировщик Beat сам выполняет роль очереди, и отдельное хранилище сообщений не требуется."],["Celery выполняет задачи исключительно внутри основного HTTP-запроса и не поддерживает ретраи.","Celery выполняет работу исключительно во время HTTP-запроса и не умеет повторять неуспешные задачи.","Фонового выполнения у Celery нет: задания запускаются синхронно в веб-обработчике без retry.","Celery — способ выполнить функцию внутри текущего request без поддержки повторов."]],"two-35":[["Контейнер содержит собственное полноценное ядро ОС; Dockerfile описывает сетевой маршрут, Compose — SQL-схему.","Контейнер запускает собственное полноценное ядро, Dockerfile описывает сетевой маршрут, Docker Compose задаёт схему SQL.","Изоляция Docker равна запуску отдельной ОС с ядром; Dockerfile — сетевой конфиг, Compose — миграции БД.","Внутри каждого контейнера собственный kernel, Dockerfile управляет маршрутизацией, Compose — структурой таблиц."],["Docker изолирует процессы на уровне ОС с общим ядром хоста; Dockerfile описывает сборку образа, Compose — конфигурацию нескольких сервисов.","Контейнеры Docker разделяют ядро ОС хоста, изолируя процессы; Dockerfile задаёт рецепт образа, Compose связывает несколько сервисов.","Docker использует механизмы изоляции ОС без отдельного ядра на контейнер; Dockerfile собирает image, Compose описывает многосервисный запуск.","В отличие от ВМ, контейнер обычно работает на общем ядре с хостом; сборка описывается Dockerfile, конфигурация сервисов — Compose."],["Контейнер — физическая машина с гипервизором; Dockerfile используется только для запуска готовых образов.","Контейнер — отдельное физическое устройство с гипервизором; Dockerfile может только запускать уже готовые образы.","В Docker контейнер представляет собой физический сервер с виртуализацией, а Dockerfile не поддерживает сборку.","Контейнер требует отдельное железо и гипервизор; Dockerfile предназначен исключительно для `docker run`."],["Docker Compose заменяет оркестратор Kubernetes и автоматически управляет распределённым кластером.","Docker Compose полностью заменяет Kubernetes и самостоятельно оркестрирует распределённый кластер.","Compose предоставляет все возможности кластерной оркестрации Kubernetes из коробки.","Для управления множеством узлов и self-healing достаточно Docker Compose, Kubernetes избыточен в любом кластере."]],"two-36":[["Pod — минимальная единица запуска; Deployment управляет репликами и обновлениями, Service даёт стабильный доступ, Ingress описывает HTTP(S)-маршруты внутрь кластера.","Pod запускает один или несколько тесно связанных контейнеров; Deployment управляет репликами, Service — сетевой точкой доступа, Ingress — внешними HTTP(S)-маршрутами.","В Kubernetes Pod — базовая единица размещения, Deployment следит за нужным числом экземпляров, Service предоставляет стабильный endpoint, Ingress задаёт входящие маршруты.","Реплики и обновления описывают Deployment, контейнеры выполняются в Pod, Service связывает их адресом, Ingress маршрутизирует входящий HTTP-трафик."],["Pod — виртуальная машина, Deployment — система хранения файлов, Service — только cron-задача, Ingress — база данных.","Pod соответствует ВМ, Deployment хранит файлы, Service выполняет только cron, Ingress представляет базу данных.","В Kubernetes термины означают: Pod — виртуалка, Deployment — файловое хранилище, Service — cron-задача, Ingress — СУБД.","Pod выделяет отдельную ОС, Deployment — storage, Service — планировщик времени, Ingress — таблицу данных."],["Deployment запускает один контейнер без реплик, а Service обязательно публикует его напрямую в интернете.","Deployment умеет запускать только одиночный контейнер без копий, а Service непременно делает его доступным из интернета.","Любой Deployment ограничен одной репликой, а создание Service сразу открывает публичный доступ.","Кластер не поддерживает реплики в Deployment; Service всегда выставляет внешнюю точку в публичную сеть."],["Ingress отвечает за физическое распределение CPU между узлами, а Pod — за DNS домена.","Ingress распределяет физические процессорные ресурсы между нодами, а Pod отвечает за доменные имена DNS.","За CPU scheduling служит Ingress, за управление DNS-именами — Pod.","Ingress закрепляет ядра CPU за узлами, Pod конфигурирует доменную маршрутизацию."]],"two-37":[["CI — ручная проверка релиза, CD — исключительно написание unit-тестов.","CI означает ручной контроль релиза, а CD — только создание unit-тестов.","Continuous Integration — это ручная приёмка, Continuous Delivery — написание модульных проверок.","CI не автоматизирует интеграцию, а CD используется исключительно для добавления тестов."],["CI автоматически интегрирует изменения со сборкой и тестами; CD автоматизирует доставку или развёртывание после проверок.","Continuous Integration запускает сборку и тесты при объединении изменений, CD организует автоматизированную доставку или развёртывание после проверок.","CI — регулярная интеграция кода с автоматическими проверками, CD — подготовка релиза и его доставка вплоть до автоматического деплоя.","В CI обновления проходят build/test, в CD результат пайплайна доставляется к окружениям или выкладывается."],["CI/CD устраняет необходимость в код-ревью и мониторинге, потому что пайплайн гарантирует отсутствие дефектов.","Если настроены CI/CD, код-ревью и наблюдение за production уже не требуются: пайплайн гарантирует отсутствие багов.","Автоматизация сборки и релиза делает мониторинг и ревью ненужными, так как дефекты полностью исключены.","Наличие CI/CD гарантирует корректность любого изменения и отменяет проверки коллегами."],["Continuous Delivery и Continuous Deployment всегда означают полностью автоматический выклад в production без подтверждения.","Continuous Delivery и Continuous Deployment полностью идентичны: оба всегда выкладывают в production без участия человека.","Оба варианта CD означают безусловный автоматический деплой каждого коммита в продакшен.","Между Delivery и Deployment нет различий; ручное подтверждение релиза не допускается ни там ни там."]],"two-38":[["Unit проверяют отдельные единицы кода, интеграционные — взаимодействия компонентов, E2E — пользовательский сценарий целиком; моки заменяют зависимости, фикстуры готовят окружение.","Unit тестирует отдельные части, integration — их взаимодействие, E2E — целую пользовательскую цепочку; mocks имитируют зависимости, fixtures создают исходные условия.","Модульные проверки локализованы, интеграционные проверяют связки, E2E воспроизводят путь пользователя; моки подменяют внешнее поведение, фикстуры подготавливают данные и окружение.","От функции к взаимодействию компонентов и полной системе идут unit → integration → E2E; для изоляции нужны моки, для настройки — фикстуры."],["Unit всегда требуют реальную БД и браузер, интеграционные не используют внешние системы, E2E тестируют только одну функцию.","Модульный тест обязан использовать браузер и настоящую БД; интеграционный не обращается к другим компонентам, E2E проверяет только одну функцию.","Unit всегда выполняют полный стек с реальными зависимостями, integration работает изолированно, E2E ограничен методом.","Для unit нужен production-like браузер и база, integration запрещает внешние модули, E2E изучает отдельный unit."],["Мок — набор исходных тестовых данных, а фикстура — заменитель реального API с заранее заданными ответами.","Mock — это тестовый набор входных данных, а fixture — подставной ответ внешнего API.","Моки подготавливают исходные данные, а фикстуры заменяют интеграции фиктивными сервисами.","Под mock понимают только данные для теста; под fixture — имитацию поведения стороннего API."],["Пирамида тестирования рекомендует максимум E2E и минимум unit, потому что E2E всегда быстрее.","Рекомендуется делать почти все проверки E2E и совсем немного unit, так как сквозные тесты выполняются быстрее.","Пирамида тестирования строится широким основанием из E2E, ведь они дешевле и быстрее модульных.","Чем выше доля E2E и меньше unit, тем правильнее пирамида тестов из-за скорости сквозных сценариев."]],"two-39":[["Монолит всегда разворачивается на одном сервере, а каждый микросервис обязан использовать собственный язык программирования.","Монолит обязан жить на одном физическом сервере, а микросервисы должны быть написаны на разных языках.","В монолите запрещены несколько экземпляров развертывания, микросервисы не могут использовать общий язык программирования.","Монолит = один хост без масштабирования, микросервисы = обязательная полиглотность языков."],["Микросервисы исключают сетевые сбои и обеспечивают транзакции между всеми сервисами без дополнительных механизмов.","Микросервисная архитектура по определению убирает сетевые сбои и позволяет делать общие транзакции без координации.","Разделение на сервисы автоматически устраняет проблемы сети и распределённой согласованности.","Любые операции разных микросервисов по умолчанию атомарны, а сетевые отказы для них невозможны."],["Монолит объединяет функциональность в одном развёртываемом приложении; микросервисы разделяют её на независимо развёртываемые компоненты, добавляя сетевую и операционную сложность.","Монолит разворачивается как одна система; микросервисы — отдельными независимыми компонентами, что упрощает их автономный релиз, но добавляет распределённую сложность.","В монолитной архитектуре код объединён в одно приложение, в микросервисной — декомпозирован на independently deployable services с накладными расходами сети и эксплуатации.","Микросервисы дают независимые сервисные развертывания вместо единого монолита, однако требуют управления взаимодействиями, наблюдаемостью и сбоями сети."],["Монолит нельзя масштабировать горизонтально, а микросервисы автоматически гарантируют меньшую задержку любого запроса.","Монолит невозможно масштабировать несколькими экземплярами, а микросервисы всегда отвечают быстрее.","Горизонтальное масштабирование доступно только микросервисам, которые гарантированно уменьшают latency всех вызовов.","Монолит не может работать в нескольких репликах; в микросервисах время любого запроса обязательно меньше."]],"three-0":[["ООП организует код вокруг объектов, объединяющих данные и поведение; часто выделяют абстракцию, инкапсуляцию, наследование и полиморфизм.","В объектно-ориентированном подходе программа состоит из взаимодействующих объектов с состоянием и поведением; ключевые идеи — абстракция, инкапсуляция, наследование, полиморфизм.","ООП представляет систему через объекты, содержащие данные и операции над ними; традиционно называют четыре принципа: инкапсуляция, абстракция, полиморфизм и наследование.","Объекты объединяют свойства и методы, а ООП строится на сокрытии деталей, выделении существенного, наследовании и общем интерфейсе разных реализаций."],["ООП организует код вокруг функций без состояния; его принципы — композиция, рекурсия, чистота и иммутабельность.","ООП описывает программу как набор чистых функций без состояния, основанных на рекурсии, композиции и неизменяемости.","В объектной парадигме главные элементы — stateless-функции; её основы: чистота, рекурсивность, иммутабельность и композиция.","ООП исключает состояние объектов, используя исключительно функциональную композицию и рекурсию."],["ООП — способ хранения объектов в БД; основные принципы — индексация, нормализация, шардирование и репликация.","ООП — технология сохранения объектов в базах данных; её принципы включают нормализацию, индексы, репликацию и шардирование.","Ориентация на объекты означает устройство хранилища БД, где основами считаются индексирование, распределение данных и нормальные формы.","Главная цель ООП — хранить экземпляры в СУБД с индексами, репликацией, шардированием и нормализацией."],["ООП требует, чтобы весь код был внутри одного класса; принципы — интерфейсы, события, очереди и транзакции.","ООП предписывает разместить все действия программы в одном классе; его принципы — события, интерфейсы, очереди и транзакции.","Чтобы следовать ООП, нельзя создавать более одного класса; основные идеи — транзакции, обработка событий, интерфейсы и очереди.","Объектная архитектура — один общий класс для всей системы, использующий события, очереди, транзакции и интерфейсы."]],"three-1":[["Инкапсуляция — сокрытие сложных деталей, абстракция — копирование поведения родителя, наследование — смена типа объекта, полиморфизм — запрет модификаций.","Инкапсуляция скрывает сложность, абстракция копирует родительские методы, наследование меняет тип экземпляра, полиморфизм запрещает правки.","Сокрытие деталей — это инкапсуляция, перенос кода родителя — абстракция, замена типа — наследование, неизменяемость — полиморфизм.","Под абстракцией понимают наследование функций, под наследованием смену типа, под полиморфизмом невозможность модификации."],["Инкапсуляция объединяет данные и управление доступом, абстракция выделяет существенное, наследование переиспользует/расширяет поведение, полиморфизм даёт единый интерфейс разным реализациям.","Инкапсуляция связывает состояние и работу с ним, абстракция оставляет существенные свойства, наследование расширяет базовое поведение, полиморфизм поддерживает единый контракт для разных типов.","Данные и контроль доступа относятся к инкапсуляции, выделение интерфейса — к абстракции, переиспользование через потомков — к наследованию, общий вызов разных реализаций — к полиморфизму.","Инкапсулировать — объединить состояние и поведение; абстрагировать — скрыть несущественное; наследовать — расширить базовый тип; полиморфизм — использовать разные реализации одинаковым образом."],["Абстракция и инкапсуляция — полные синонимы, наследование и полиморфизм — только способы работы с памятью.","Абстракция равнозначна инкапсуляции, а наследование вместе с полиморфизмом описывают только выделение памяти.","Первые два принципа полностью совпадают по смыслу, последние два касаются исключительно размещения объектов в RAM.","Сокрытие деталей и управление доступом — один и тот же термин, а полиморфизм и наследование нужны лишь для памяти."],["Наследование означает передачу данных по сети, полиморфизм — обязательное создание множества экземпляров одного класса.","Наследование передаёт данные между компьютерами, а полиморфизм требует соз
